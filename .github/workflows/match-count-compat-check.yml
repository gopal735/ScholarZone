name: Match Count Compatibility Check

# Read-only production compatibility audit for Match 2.0 and Count
# Intelligence 2.0. Manual only: it opens a transaction against the production
# database, reads the authoritative public-visibility predicate and the columns
# the Match engine iterates, then rolls back. It writes nothing.
#
# The database URL comes from the repository secret and is never printed. The
# script reports dialect, schema presence, the public candidate pool, and the
# observed JSON shape of every list[str] column Match reads.
on:
  workflow_dispatch:

jobs:
  compat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The audit imports the application's own visibility predicate and models
      # rather than reimplementing them, so it needs the application's pinned
      # dependencies and not merely a database driver.
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run compatibility audit
        run: |
          cd backend
          python scripts/match_count_compat.py
        env:
          SCHOLARZONE_DATABASE_URL: ${{ secrets.SCHOLARZONE_DATABASE_URL }}
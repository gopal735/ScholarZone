name: Student Dashboard Schema

# The production API deliberately does not run create_all on startup: it
# verifies connectivity and nothing else, because create_all plus ALTER TABLE
# take ACCESS EXCLUSIVE locks that deadlock a serverless cold start. That means
# a new table has to be applied deliberately, which is what this workflow is.
#
# Read-only by default. Applying requires an explicit confirmation, and the
# dry run is always printed first so the exact DDL is in the log either way.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually create the missing tables. Leave false for a dry run."
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# `shell: bash` adds `-o pipefail`, which GitHub's default Linux shell omits.
# Without it the two migration steps below reported tee's exit status - always 0
# - so a dry run that failed to connect, or a migration that failed to apply, was
# logged as a success. migrate_schema.py already exits 0 for a genuine no-op
# ("Schema is already up to date") and 1 only on a real failure, so this makes a
# real failure visible without turning a normal no-op run red.
defaults:
  run:
    shell: bash

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Pre-apply validation
        if: ${{ inputs.apply }}
        env:
          SCHOLARZONE_DATABASE_URL: ${{ secrets.SCHOLARZONE_DATABASE_URL }}
          SCHOLARZONE_ENVIRONMENT: production
          SCHOLARZONE_EXPECTED_DB_IDENTIFIER: ${{ secrets.SCHOLARZONE_EXPECTED_DB_IDENTIFIER }}
          SCHOLARZONE_EXPECTED_DB_HOST: ${{ secrets.SCHOLARZONE_EXPECTED_DB_HOST }}
          SCHOLARZONE_BACKUP_VERIFIED: ${{ secrets.SCHOLARZONE_BACKUP_VERIFIED }}
          SCHOLARZONE_RESTORE_TEST_DATE: ${{ secrets.SCHOLARZONE_RESTORE_TEST_DATE }}
          SCHOLARZONE_BACKUP_EVIDENCE_REF: ${{ secrets.SCHOLARZONE_BACKUP_EVIDENCE_REF }}
        run: |
          set -euo pipefail
          cd backend
          
          # Verify all required inputs are present
          if [[ -z "${SCHOLARZONE_EXPECTED_DB_IDENTIFIER}" ]]; then
            echo "ERROR: SCHOLARZONE_EXPECTED_DB_IDENTIFIER secret not configured"
            exit 1
          fi
          if [[ -z "${SCHOLARZONE_EXPECTED_DB_HOST}" ]]; then
            echo "ERROR: SCHOLARZONE_EXPECTED_DB_HOST secret not configured"
            exit 1
          fi
          if [[ "${SCHOLARZONE_BACKUP_VERIFIED,,}" != "true" ]]; then
            echo "ERROR: SCHOLARZONE_BACKUP_VERIFIED must be explicitly set to true after operator verification"
            exit 1
          fi
          if [[ -z "${SCHOLARZONE_RESTORE_TEST_DATE}" ]]; then
            echo "ERROR: SCHOLARZONE_RESTORE_TEST_DATE secret not configured"
            exit 1
          fi
          if [[ -z "${SCHOLARZONE_BACKUP_EVIDENCE_REF}" ]]; then
            echo "ERROR: SCHOLARZONE_BACKUP_EVIDENCE_REF secret not configured"
            exit 1
          fi
          
          python - <<'PY'
          import os
          from datetime import date, datetime, timedelta

          raw = os.environ["SCHOLARZONE_RESTORE_TEST_DATE"]
          try:
              tested = datetime.strptime(raw, "%Y-%m-%d").date()
          except ValueError:
              raise SystemExit("ERROR: restore test date must use YYYY-MM-DD")
          today = date.today()
          if tested > today:
              raise SystemExit("ERROR: restore test date cannot be in the future")
          if today - tested > timedelta(days=30):
              raise SystemExit("ERROR: restore test evidence must be no older than 30 days")
          if not os.environ["SCHOLARZONE_BACKUP_EVIDENCE_REF"].strip():
              raise SystemExit("ERROR: backup evidence reference must not be empty")
          PY
          
          echo "Pre-apply validation passed."

      - name: Dry run
        env:
          SCHOLARZONE_DATABASE_URL: ${{ secrets.SCHOLARZONE_DATABASE_URL }}
          SCHOLARZONE_ENVIRONMENT: production
          SCHOLARZONE_EXPECTED_DB_IDENTIFIER: ${{ secrets.SCHOLARZONE_EXPECTED_DB_IDENTIFIER }}
          SCHOLARZONE_EXPECTED_DB_HOST: ${{ secrets.SCHOLARZONE_EXPECTED_DB_HOST }}
        run: |
          cd backend
          python migrate_schema.py --dry-run 2>&1 | tee migrate_dry_run.log

      - name: Apply
        if: ${{ inputs.apply }}
        env:
          SCHOLARZONE_DATABASE_URL: ${{ secrets.SCHOLARZONE_DATABASE_URL }}
          SCHOLARZONE_ENVIRONMENT: production
          SCHOLARZONE_EXPECTED_DB_IDENTIFIER: ${{ secrets.SCHOLARZONE_EXPECTED_DB_IDENTIFIER }}
          SCHOLARZONE_EXPECTED_DB_HOST: ${{ secrets.SCHOLARZONE_EXPECTED_DB_HOST }}
          SCHOLARZONE_BACKUP_VERIFIED: ${{ secrets.SCHOLARZONE_BACKUP_VERIFIED }}
          SCHOLARZONE_RESTORE_TEST_DATE: ${{ secrets.SCHOLARZONE_RESTORE_TEST_DATE }}
          SCHOLARZONE_BACKUP_EVIDENCE_REF: ${{ secrets.SCHOLARZONE_BACKUP_EVIDENCE_REF }}
        run: |
          cd backend
          python migrate_schema.py --apply 2>&1 | tee migrate_apply.log

      - name: Validate
        if: ${{ inputs.apply }}
        env:
          SCHOLARZONE_DATABASE_URL: ${{ secrets.SCHOLARZONE_DATABASE_URL }}
          SCHOLARZONE_ENVIRONMENT: production
          SCHOLARZONE_EXPECTED_DB_IDENTIFIER: ${{ secrets.SCHOLARZONE_EXPECTED_DB_IDENTIFIER }}
          SCHOLARZONE_EXPECTED_DB_HOST: ${{ secrets.SCHOLARZONE_EXPECTED_DB_HOST }}
        run: |
          cd backend
          python migrate_schema.py --validate-only

      - name: Upload migration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-dashboard-migration-logs
          path: backend/migrate_*.log

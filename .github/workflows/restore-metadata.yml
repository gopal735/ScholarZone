name: Restore Metadata
on:
  workflow_dispatch:
env:
  API_URL: https://scholarzone-api-2ee2d.containers.snapdeploy.app

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install requests
        run: pip install requests

      - name: Wait for container wake-up
        run: |
          python -c "
          import requests, time, sys
          print('Waiting for production container to wake up...')
          for i in range(30):
              try:
                  r = requests.get('${{ env.API_URL }}/health', timeout=15)
                  if r.status_code == 200:
                      print(f'Container awake at attempt {i+1}: {r.text}')
                      break
                  else:
                      print(f'Attempt {i+1}: HTTP {r.status_code}')
              except Exception as e:
                  print(f'Attempt {i+1}: {e}')
              time.sleep(30)
          else:
              print('ERROR: Container did not wake up after 15 minutes')
              sys.exit(1)
          "

      - name: Restore metadata with retry
        run: |
          python -c "
          import requests, json, time, sys
          API_URL = '${{ env.API_URL }}'
          payload = {'verification_status': 'active', 'verified_by': None, 'verification_notes': None}
          url = f'{API_URL}/scholarships/29/verify'
          for attempt in range(5):
              time.sleep(45)
              try:
                  r = requests.patch(url, json=payload, timeout=30)
                  print(f'Attempt {attempt+1}: HTTP {r.status_code}')
                  if r.status_code == 200:
                      print(f'SUCCESS: {r.json()}')
                      break
                  else:
                      print(f'Response: {r.text}')
              except Exception as e:
                  print(f'Attempt {attempt+1}: {e}')
                  time.sleep(60)
          else:
              print('ERROR: All restore attempts failed')
              sys.exit(1)
          "

      - name: Verify after restore
        run: |
          sleep 5
          curl -s "${{ env.API_URL }}/scholarships/29" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps({k:d[k] for k in ['verified_by','verification_notes','verification_status']}, indent=2))"

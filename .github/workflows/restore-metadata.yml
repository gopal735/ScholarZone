name: Restore Metadata
on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore test metadata
        run: |
          python3 -c "
          import urllib.request, urllib.error, json, time
          for attempt in range(3):
              try:
                  payload = json.dumps({'verification_status':'active','verified_by':None,'verification_notes':None}).encode('utf-8')
                  req = urllib.request.Request('https://scholarzone-api-2ee2d.containers.snapdeploy.app/scholarships/29/verify', data=payload, headers={'Content-Type':'application/json'}, method='PATCH')
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      print(resp.read().decode())
                      break
              except urllib.error.HTTPError as e:
                  print(f'HTTP {e.code}: {e.read().decode()}')
                  time.sleep(5)
          "
      - name: Verify after restore
        run: |
          sleep 2
          curl -s "https://scholarzone-api-2ee2d.containers.snapdeploy.app/scholarships/29" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps({k:d[k] for k in ['verified_by','verification_notes','verification_status','last_verified_date','next_verification_due']}, indent=2))"

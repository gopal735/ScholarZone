name: Admin Auth Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Test authorized admin access
        env:
          SECRET: ${{ secrets.SCHOLARZONE_VERIFICATION_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "SECRET IS NOT CONFIGURED"
            exit 1
          fi

          STATUS=$(curl -sS -o response.json -w "%{http_code}" \
            -H "X-Admin-Secret: $SECRET" \
            "https://scholarzone-fwzj.vercel.app/api/admin/verification/summary")

          echo "Authorized HTTP status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "AUTHORIZED ADMIN TEST FAILED"
            cat response.json
            exit 1
          fi

          echo "AUTHORIZED ADMIN TEST: PASS"

      - name: Test anonymous access
        run: |
          STATUS=$(curl -sS -o response.json -w "%{http_code}" \
            "https://scholarzone-fwzj.vercel.app/api/admin/verification/summary")

          echo "Anonymous HTTP status: $STATUS"

          if [ "$STATUS" != "401" ]; then
            echo "ANONYMOUS SECURITY TEST FAILED"
            cat response.json
            exit 1
          fi

          echo "ANONYMOUS SECURITY TEST: PASS"

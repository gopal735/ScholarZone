name: Single-Scholarship Controlled Verification Test

on:
  workflow_dispatch:

env:
  API_URL: https://scholarzone-api-2ee2d.containers.snapdeploy.app

jobs:
  single-scholarship-test:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install requests
        run: pip install requests

      - name: Wait for container wake-up
        run: |
          python -c "
          import requests, time, sys
          print('Waiting for production container to wake up...')
          for i in range(30):
              try:
                  r = requests.get('${{ env.API_URL }}/health', timeout=15)
                  if r.status_code == 200:
                      print(f'Container awake at attempt {i+1}: {r.text}')
                      break
                  else:
                      print(f'Attempt {i+1}: HTTP {r.status_code}')
              except Exception as e:
                  print(f'Attempt {i+1}: {e}')
              time.sleep(30)
          else:
              print('ERROR: Container did not wake up after 15 minutes')
              sys.exit(1)
          "

      - name: Run single-scholarship verification test
        run: |
          python -c "
          import requests, json, sys
          from datetime import date, timedelta

          API_URL = '${{ env.API_URL }}'

          def fetch_total():
              r = requests.get(f'{API_URL}/scholarships?page=1&limit=1', timeout=30)
              data = r.json()
              return data['pagination']['total'], r.status_code

          def get_scholarship(sid):
              r = requests.get(f'{API_URL}/scholarships/{sid}', timeout=30)
              return r.json(), r.status_code

          def get_verification_queue():
              r = requests.get(f'{API_URL}/scholarships/verification-queue', timeout=30)
              return r.json(), r.status_code

          def get_scholarship_list(page=1, limit=100):
              r = requests.get(f'{API_URL}/scholarships?page={page}&limit={limit}', timeout=30)
              return r.json(), r.status_code

          def patch_verify(sid, payload):
              r = requests.patch(f'{API_URL}/scholarships/{sid}/verify', json=payload, timeout=30)
              return r.json(), r.status_code

          def get_status():
              r = requests.get(f'{API_URL}/internal/verify/status', timeout=30)
              return r.json(), r.status_code

          def extract_state(item):
              return {
                  'id': item.get('id'),
                  'title': item.get('title'),
                  'country': item.get('country'),
                  'degree': item.get('degree'),
                  'funding': item.get('funding'),
                  'official_source_url': item.get('official_source_url'),
                  'official_source': item.get('official_source'),
                  'verification_status': item.get('verification_status'),
                  'last_verified_at': item.get('last_verified_at'),
                  'last_verified_date': item.get('last_verified_date'),
                  'is_verified': item.get('verified'),
                  'next_verification_due': item.get('next_verification_due'),
                  'verified_by': item.get('verified_by'),
                  'verification_notes': item.get('verification_notes'),
                  'updated_at': item.get('updated_at'),
              }

          # ===== Step 1: Record BEFORE state =====
          print('=== BEFORE STATE ===')

          total_before, _ = fetch_total()
          print(f'Total scholarships BEFORE: {total_before}')

          verify_status, _ = get_status()
          print(f'Verification scheduler status BEFORE: {json.dumps(verify_status)}')

          # Try verification queue first (returns full ScholarshipDetailResponse with official_source_url)
          queue, qc = get_verification_queue()
          print(f'Verification queue size: {len(queue)}, HTTP {qc}')

          target = None
          # Look in the verification queue for a scholarship with a stable official_source_url
          for item in queue:
              url = item.get('official_source_url', '')
              if url and item.get('title') and ('http' in url):
                  target = item
                  print(f'Found target in verification queue: ID={item[\"id\"]}, URL={url}')
                  break

          if not target:
              # Fallback: iterate through main list pages and fetch details
              print('No target in verification queue, searching main list...')
              for page in range(1, 5):
                  scholarships, sc = get_scholarship_list(page=page, limit=100)
                  print(f'Page {page}: HTTP {sc}, count={len(scholarships[\"items\"])}')
                  for item in scholarships['items']:
                      sid = item['id']
                      detail, dc = get_scholarship(sid)
                      if dc == 200:
                          url = detail.get('official_source_url', '')
                          if url and detail.get('title'):
                              target = detail
                              print(f'Found target on page {page}: ID={sid}, URL={url}')
                              break
                  if target:
                      break

          if not target:
              print('ERROR: No suitable scholarship found with official_source_url')
              sys.exit(1)

          target_id = target['id']
          BEFORE = extract_state(target)
          print(f'Selected target scholarship ID: {target_id}')
          print(f'BEFORE: {json.dumps(BEFORE, indent=2, default=str)}')

          in_queue_before = any(s.get('id') == target_id for s in queue)
          print(f'Target in verification queue BEFORE: {in_queue_before}')

          # Collect IDs from all pages for integrity check
          all_ids_before = set()
          total_pages = (total_before + 99) // 100
          print(f'Need to check {total_pages} pages for ID integrity')
          for page in range(1, min(total_pages + 1, 5)):
              sl, _ = get_scholarship_list(page=page, limit=100)
              for item in sl['items']:
                  all_ids_before.add(item['id'])

          print(f'Total unique IDs collected (pages 1-{min(total_pages, 4)}): {len(all_ids_before)}')
          dup_count = total_before - len(all_ids_before)
          if min(total_pages, 4) * 100 >= total_before:
              print(f'Duplicate IDs found: {dup_count}')
          else:
              print(f'Checked {len(all_ids_before)} IDs (partial scan, {total_before} total)')

          # ===== Step 2: Execute single-scholarship PATCH verification =====
          print()
          print('=== EXECUTING SINGLE-SCHOLARSHIP VERIFICATION ===')

          PATCH_PAYLOAD = {
              'verification_status': 'active',
              'verification_notes': 'Controlled single-scholarship verification test',
              'verified_by': 'single-scholarship-test',
          }

          print(f'Calling PATCH /scholarships/{target_id}/verify')
          result, patch_code = patch_verify(target_id, PATCH_PAYLOAD)
          print(f'PATCH response: HTTP {patch_code}')
          print(f'Response body: {json.dumps(result, indent=2, default=str)}')

          # ===== Step 3: Record AFTER state =====
          print()
          print('=== AFTER STATE ===')

          total_after, _ = fetch_total()
          print(f'Total scholarships AFTER: {total_after}')

          scholarship_after, sa_code = get_scholarship(target_id)
          print(f'GET /scholarships/{target_id}: HTTP {sa_code}')

          AFTER = extract_state(scholarship_after)
          print(f'AFTER: {json.dumps(AFTER, indent=2, default=str)}')

          verify_status_after, _ = get_status()
          print(f'Verification scheduler status AFTER: {json.dumps(verify_status_after)}')

          queue_after, _ = get_verification_queue()
          in_queue_after = any(s.get('id') == target_id for s in queue_after)
          print(f'Target in verification queue AFTER: {in_queue_after}')

          # ===== Step 4: Integrity checks =====
          print()
          print('=== INTEGRITY CHECKS ===')

          # 1. Scholarship count unchanged
          count_unchanged = (total_before == total_after)
          print(f'1. Scholarship count unchanged ({total_before} -> {total_after}): {count_unchanged}')

          # 2. last_verified_at should be today
          today_str = date.today().isoformat()
          lv_changed = AFTER.get('last_verified_at') == today_str
          print(f'2. last_verified_at is today ({today_str}): {lv_changed} (value: {AFTER.get(\"last_verified_at\")})')

          # 3. next_verification_due should be 90 days from today
          expected_due = (date.today() + timedelta(days=90)).isoformat()
          due_changed = AFTER.get('next_verification_due') == expected_due
          print(f'3. next_verification_due is 90 days out ({expected_due}): {due_changed} (value: {AFTER.get(\"next_verification_due\")})')

          # 4. verified_by set correctly
          vb_changed = AFTER.get('verified_by') == 'single-scholarship-test'
          print(f'4. verified_by set correctly: {vb_changed} (value: {AFTER.get(\"verified_by\")})')

          # 5. verification_status is active
          vs_changed = AFTER.get('verification_status') == 'active'
          print(f'5. verification_status is active: {vs_changed} (value: {AFTER.get(\"verification_status\")})')

          # 6. is_verified is True
          is_verified = AFTER.get('is_verified') == True
          print(f'6. is_verified is True: {is_verified} (value: {AFTER.get(\"is_verified\")})')

          # 7. updated_at changed
          updated_changed = BEFORE.get('updated_at') != AFTER.get('updated_at')
          print(f'7. updated_at changed: {updated_changed} (before: {BEFORE.get(\"updated_at\")}, after: {AFTER.get(\"updated_at\")})')

          # 8. No scheduler triggered
          scheduler_not_triggered = not verify_status_after.get('scheduler_running', False)
          print(f'8. Scheduler NOT triggered (scheduler_running=False): {scheduler_not_triggered}')

          # 9. Official source URL unchanged (not modified by verification)
          url_unchanged = BEFORE.get('official_source_url') == AFTER.get('official_source_url')
          print(f'9. official_source_url unchanged: {url_unchanged}')

          # 10. All IDs still unique (no duplicates)
          all_ids_after = set()
          for page in range(1, min(total_pages + 1, 5)):
              sl, _ = get_scholarship_list(page=page, limit=100)
              for item in sl['items']:
                  all_ids_after.add(item['id'])
          no_dup_after = (all_ids_before == all_ids_after)
          print(f'10. No duplicate IDs (before == after): {no_dup_after}')

          # 11. last_verified_date should also be today
          lv_date_changed = AFTER.get('last_verified_date') == today_str
          print(f'11. last_verified_date is today: {lv_date_changed} (value: {AFTER.get(\"last_verified_date\")})')

          # 12. verification_notes set correctly
          notes_changed = AFTER.get('verification_notes') == 'Controlled single-scholarship verification test'
          print(f'12. verification_notes set correctly: {notes_changed}')

          all_pass = (
              count_unchanged and
              lv_changed and
              due_changed and
              vb_changed and
              vs_changed and
              is_verified and
              updated_changed and
              scheduler_not_triggered and
              url_unchanged and
              no_dup_after and
              lv_date_changed and
              notes_changed
          )

          print()
          if all_pass:
              print('=== RESULT: ALL CHECKS PASSED ===')
              sys.exit(0)
          else:
              print('=== RESULT: SOME CHECKS FAILED ===')
              sys.exit(1)
          "

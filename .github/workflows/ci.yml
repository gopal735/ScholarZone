name: ScholarZone CI
'on':
  pull_request:
    branches:
    - main
    - master
    - fix/deep-scholarship-data-and-card-restoration
    - fix/production-expired-cycle-purge
  push:
    branches:
    - main
    - master
    - fix/deep-scholarship-data-and-card-restoration
    - fix/production-expired-cycle-purge
defaults:
  run:
    shell: bash
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      SCHOLARZONE_ENVIRONMENT: test
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libtiff5-dev libwebp-dev
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-v2-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          Linux-pip-v2-
    - name: Install dependencies
      run: cd backend && pip install -r requirements.txt
    - name: Install purge preflight test dependencies
      run: cd backend && pip install -r requirements-purge-preflight.txt
    - name: Debug - verify pip install
      run: |
        cd backend && pip list | grep -E "(fastapi|pydantic|sqlalchemy|psycopg|httpx|pillow|beautifulsoup4|apscheduler|resend|python-dotenv)" || true
    - name: Debug - test critical imports
      run: |
        cd backend && python -c "import psycopg; print('psycopg: OK')" 2>&1 || echo "psycopg: FAIL"
        python -c "import sqlalchemy; print('sqlalchemy: OK')" 2>&1 || echo "sqlalchemy: FAIL"
        python -c "import fastapi; print('fastapi: OK')" 2>&1 || echo "fastapi: FAIL"
        python -c "import pydantic; print('pydantic: OK')" 2>&1 || echo "pydantic: FAIL"
        python -c "import httpx; print('httpx: OK')" 2>&1 || echo "httpx: FAIL"
        python -c "import PIL; print('PIL: OK')" 2>&1 || echo "PIL: FAIL"
        python -c "import bs4; print('bs4: OK')" 2>&1 || echo "bs4: FAIL"
        python -c "import apscheduler; print('apscheduler: OK')" 2>&1 || echo "apscheduler: FAIL"
        python -c "import resend; print('resend: OK')" 2>&1 || echo "resend: FAIL"
        python -c "import dotenv; print('dotenv: OK')" 2>&1 || echo "dotenv: FAIL"
    - name: Debug - verify environment
      run: |
        cd backend && python -c "import sys; print(f'Python: {sys.version}'); import app; print('app import ok'); import pytest; print('pytest ok')" 2>&1
    - name: Debug - verify pytest-asyncio
      run: |
        cd backend && python -c "import pytest_asyncio; print('pytest_asyncio: OK')" 2>&1 || echo "pytest_asyncio: FAIL - reinstalling" && pip install 'pytest-asyncio>=0.23,<1'
    - name: Debug - run simple test
      run: cd backend && python -m pytest tests/test_git_integrity_regression.py -v --tb=short 2>&1
    - name: Run backend tests
      run: cd backend && set -o pipefail && python -m pytest tests/ --tb=short 2>&1 | tee pytest.log
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: backend-tests-logs
        path: backend/pytest.log

  # Gate 1 Integration Test with Disposable PostgreSQL (AUTHORITATIVE)
  gate1-integration:
    name: Gate 1 - Atomicity Integration Test (PostgreSQL ${{ matrix.pg-version }})
    runs-on: ubuntu-latest
    needs: [backend-tests]
    strategy:
      matrix:
        pg-version: ['16', '18']
      fail-fast: false
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5433/test_purge
      SCHOLARZONE_ENVIRONMENT: test
    services:
      postgres:
        image: postgres:${{ matrix.pg-version }}
        env:
          POSTGRES_DB: test_purge
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U test -d test_purge"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: cd backend && pip install -r requirements.txt
    - name: Install purge preflight test dependencies
      run: cd backend && pip install -r requirements-purge-preflight.txt
    - name: Wait for PostgreSQL to be ready
      run: |
        for i in {1..30}; do
          if pg_isready -h localhost -p 5433 -U test -d test_purge; then
            echo "PostgreSQL ${{ matrix.pg-version }} is ready"
            break
          fi
          echo "Waiting for PostgreSQL... ($i/30)"
          sleep 2
        done
    - name: Run Gate 1 Integration Test
      run: |
        cd backend
        # Run the pytest integration test (marked @pytest.mark.integration)
        python -m pytest tests/test_purge_preflight.py::test_gate1_integration_with_disposable_db -v --tb=short 2>&1 | tee gate1_integration_test.log
        # Also run the CLI to generate gate1_result.json artifact
        python -m app.services.purge_preflight.gate1_atomicity 2>&1 | tee -a gate1_integration_test.log
    - name: Verify Gate 1 test executed (not skipped)
      run: |
        cd backend
        if grep -q "SKIPPED" gate1_integration_test.log; then
          echo "ERROR: Gate 1 integration test was SKIPPED - TEST_DATABASE_URL may not be set correctly"
          cat gate1_integration_test.log
          exit 1
        fi
        if ! grep -q "PASSED\|PASS" gate1_integration_test.log; then
          echo "ERROR: Gate 1 integration test did not pass"
          cat gate1_integration_test.log
          exit 1
        fi
        echo "Gate 1 integration test executed and passed"
    - name: Upload Gate 1 integration results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: gate1-integration-results-pg${{ matrix.pg-version }}
        path: |
          backend/gate1_result.json
          backend/gate1_integration_test.log
    - name: Upload Gate 1 logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: gate1-integration-failure-logs-pg${{ matrix.pg-version }}
        path: backend/gate1_integration_test.log

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-v2-${{ hashFiles('frontend/package-lock.json') }}
        restore-keys: |
          Linux-npm-v2-
    - name: Install dependencies
      run: cd frontend && npm install
    - name: Run frontend lint
      run: cd frontend && npm run lint 2>&1 | tee eslint.log
    - name: Upload lint results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: frontend-lint-logs
        path: frontend/eslint.log

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-v2-${{ hashFiles('frontend/package-lock.json') }}
        restore-keys: |
          Linux-npm-v2-
    - name: Install dependencies
      run: cd frontend && npm ci
    - name: Run frontend tests
      run: cd frontend && set -o pipefail && npm run test 2>&1 | tee vitest.log
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: frontend-test-logs
        path: frontend/vitest.log

  import-smoke:
    runs-on: ubuntu-latest
    env:
      SCHOLARZONE_ENVIRONMENT: test
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libtiff5-dev libwebp-dev
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          Linux-pip-
    - name: Install dependencies
      run: cd backend && pip install -r requirements.txt
    - name: Run import smoke test
      run: cd backend && python scripts/import_smoke_test.py 2>&1 | tee import_smoke_test.log
    - name: Upload smoke test logs
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: import-smoke-logs
        path: backend/import_smoke_test.log

  git-integrity:
    runs-on: ubuntu-latest
    env:
      SCHOLARZONE_ENVIRONMENT: test
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          Linux-pip-
    - name: Install dependencies
      run: cd backend && pip install -r requirements.txt
    - name: Run git integrity check
      run: python backend/scripts/git_integrity_check.py 2>&1 | tee backend/git_integrity.log
    - name: Upload integrity logs
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: git-integrity-logs
        path: backend/git_integrity.log

  env-config:
    runs-on: ubuntu-latest
    env:
      SCHOLARZONE_ENVIRONMENT: test
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          Linux-pip-
    - name: Install dependencies
      run: cd backend && pip install -r requirements.txt
    - name: Run env config check
      run: cd backend && python scripts/env_config_check.py 2>&1 | tee env_config_check.log
    - name: Upload env config logs
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: env-config-logs
        path: backend/env_config_check.log

  schema-compat:
    name: Schema Compatibility (PostgreSQL ${{ matrix.pg-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pg-version: ['16', '18']
      fail-fast: false
    services:
      postgres:
        image: postgres:${{ matrix.pg-version }}
        env:
          POSTGRES_DB: schema_compat_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5435:5432
        options: >-
          --health-cmd="pg_isready -U test -d schema_compat_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SCHOLARZONE_ENVIRONMENT: test
      SCHOLARZONE_DATABASE_URL: postgresql://test:test@localhost:5435/schema_compat_test?sslmode=disable
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libtiff5-dev libwebp-dev postgresql-client
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          Linux-pip-
    - name: Install dependencies
      run: cd backend && pip install -r requirements.txt
    - name: Install purge preflight test dependencies
      run: cd backend && pip install -r requirements-purge-preflight.txt
    - name: Wait for PostgreSQL to be ready
      run: |
        for i in {1..30}; do
          if pg_isready -h localhost -p 5435 -U test -d schema_compat_test; then
            echo "PostgreSQL ${{ matrix.pg-version }} is ready"
            break
          fi
          echo "Waiting for PostgreSQL... ($i/30)"
          sleep 2
        done
    - name: Initialize database schema
      run: |
        cd backend
        python scripts/init_schema.py
    - name: Run schema compat check
      run: cd backend && python scripts/schema_compat_check.py 2>&1 | tee schema_compat_check.log
    - name: Verify initialization idempotency
      run: |
        cd backend
        python scripts/verify_idempotency.py
    - name: Run schema compat check again (idempotency)
      run: cd backend && python scripts/schema_compat_check.py 2>&1 | tee schema_compat_check_idempotency.log
    - name: Upload schema compat logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: schema-compat-logs-pg${{ matrix.pg-version }}
        path: backend/schema_compat_check*.log
  build-and-smoke:
    runs-on: ubuntu-latest
    env:
      SCHOLARZONE_ENVIRONMENT: test
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libtiff5-dev libwebp-dev
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          Linux-pip-
    - name: Install dependencies
      run: cd backend && pip install -r requirements.txt
    - name: Build Docker image
      run: cd backend && docker build -t scholarzone-api:${{ github.sha }} -t scholarzone-api:latest .
    - name: Run artifact smoke test
      run: cd backend && python scripts/artifact_smoke_test.py 2>&1 | tee artifact_smoke_test.log
    - name: Upload smoke test logs
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-and-smoke-logs
        path: backend/artifact_smoke_test.log

  preflight:
    name: Preflight (PostgreSQL ${{ matrix.pg-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pg-version: ['16', '18']
      fail-fast: false
    services:
      postgres:
        image: postgres:${{ matrix.pg-version }}
        env:
          POSTGRES_DB: preflight_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5436:5432
        options: >-
          --health-cmd="pg_isready -U test -d preflight_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SCHOLARZONE_ENVIRONMENT: test
      SCHOLARZONE_DATABASE_URL: postgresql://test:test@localhost:5436/preflight_test?sslmode=disable
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libtiff5-dev libwebp-dev postgresql-client
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          Linux-pip-
    - name: Install dependencies
      run: cd backend && pip install -r requirements.txt
    - name: Install purge preflight test dependencies
      run: cd backend && pip install -r requirements-purge-preflight.txt
    - name: Wait for PostgreSQL to be ready
      run: |
        for i in {1..30}; do
          if pg_isready -h localhost -p 5436 -U test -d preflight_test; then
            echo "PostgreSQL ${{ matrix.pg-version }} is ready"
            break
          fi
          echo "Waiting for PostgreSQL... ($i/30)"
          sleep 2
        done
    - name: Initialize database schema
      run: |
        cd backend
        python scripts/init_schema.py
    - name: Run preflight
      run: python backend/scripts/preflight.py 2>&1 | tee backend/preflight.log
    - name: Upload preflight logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: preflight-logs-pg${{ matrix.pg-version }}
        path: backend/preflight.log

  snapshot-id-validation:
    name: Snapshot ID Validation
    runs-on: ubuntu-latest
    env:
      SCHOLARZONE_ENVIRONMENT: test
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libtiff5-dev libwebp-dev
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          Linux-pip-
    - name: Install dependencies
      run: cd backend && pip install -r requirements.txt
    - name: Run snapshot ID validation
      run: python backend/scripts/validate_snapshot_ids.py 2>&1 | tee backend/snapshot_id_validation.log
    - name: Upload validation logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: snapshot-id-validation-logs
        path: backend/snapshot_id_validation.log

  postgresql-migration-test:
    name: PostgreSQL Migration Integration Test (PostgreSQL ${{ matrix.pg-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pg-version: ['16', '18']
      fail-fast: false
    services:
      postgres:
        image: postgres:${{ matrix.pg-version }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: scholarzone_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U test -d scholarzone_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SCHOLARZONE_ENVIRONMENT: test
      SCHOLARZONE_DATABASE_URL: postgresql://test:test@localhost:5434/scholarzone_test?sslmode=disable
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libtiff5-dev libwebp-dev postgresql-client
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          Linux-pip-
    - name: Install dependencies
      run: cd backend && pip install -r requirements.txt
    - name: Install purge preflight test dependencies
      run: cd backend && pip install -r requirements-purge-preflight.txt
    - name: Wait for PostgreSQL to be ready
      run: |
        for i in {1..30}; do
          if pg_isready -h localhost -p 5434 -U test -d scholarzone_test; then
            echo "PostgreSQL ${{ matrix.pg-version }} is ready"
            break
          fi
          echo "Waiting for PostgreSQL... ($i/30)"
          sleep 2
        done
    - name: Run PostgreSQL migration test
      run: cd backend && python scripts/test_postgresql_migration.py 2>&1 | tee postgresql_migration_test.log
    - name: Upload migration test logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: postgresql-migration-test-logs-pg${{ matrix.pg-version }}
        path: backend/postgresql_migration_test.log

  # Gate 2 Integration Test with Disposable PostgreSQL (PG16)
  gate2-integration-pg16:
    name: Gate 2 - Identity Integration Test (PostgreSQL 16)
    runs-on: ubuntu-latest
    needs: [backend-tests]
    env:
      SCHOLARZONE_ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5437/gate2_test
      SCHOLARZONE_DATABASE_URL_RO: postgresql://gate2_ro:test@localhost:5437/gate2_test?sslmode=disable
      EXPECTED_NEON_PROJECT_ID: "test-project-16"
      EXPECTED_NEON_BRANCH_ID: "test-branch-16"
      EXPECTED_NEON_BRANCH_NAME: "main"
      EXPECTED_DATABASE_NAME: "gate2_test"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gate2_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5437:5432
        options: >-
          --health-cmd="pg_isready -U test -d gate2_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libtiff5-dev libwebp-dev postgresql-client
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-v2-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          Linux-pip-v2-
    - name: Install dependencies
      run: cd backend && pip install -r requirements.txt
    - name: Install purge preflight test dependencies
      run: cd backend && pip install -r requirements-purge-preflight.txt
    - name: Wait for PostgreSQL to be ready
      run: |
        for i in {1..30}; do
          if pg_isready -h localhost -p 5437 -U test -d gate2_test; then
            echo "PostgreSQL 16 is ready"
            break
          fi
          echo "Waiting for PostgreSQL... ($i/30)"
          sleep 2
        done
    - name: Initialize database schema and test data
      run: |
        cd backend
        python scripts/init_gate2_test_db.py 2>&1 | tee gate2_init_test.log
    - name: Run Gate 2 Integration Test
      run: |
        cd backend
        python -m pytest tests/test_purge_preflight.py::test_gate2_integration_pg16_real_db -v --tb=short 2>&1 | tee gate2_integration_pg16_test.log
    - name: Verify Gate 2 test executed (not skipped)
      run: |
        cd backend
        if grep -q "SKIPPED" gate2_integration_pg16_test.log; then
          echo "ERROR: Gate 2 integration test was SKIPPED"
          cat gate2_integration_pg16_test.log
          exit 1
        fi
        if ! grep -q "PASSED\|PASS" gate2_integration_pg16_test.log; then
          echo "ERROR: Gate 2 integration test did not pass"
          cat gate2_integration_pg16_test.log
          exit 1
        fi
        echo "Gate 2 integration test (PG16) executed and passed"
    - name: Upload Gate 2 integration results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: gate2-integration-results-pg16
        path: |
          backend/gate2_result.json
          backend/gate2_integration_pg16_test.log
          backend/gate2_init_test.log
    - name: Upload Gate 2 logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: gate2-integration-failure-logs-pg16
        path: backend/gate2_integration_pg16_test.log

  # Gate 2 Integration Test with Disposable PostgreSQL (PG18)
  gate2-integration-pg18:
    name: Gate 2 - Identity Integration Test (PostgreSQL 18)
    runs-on: ubuntu-latest
    needs: [backend-tests]
    env:
      SCHOLARZONE_ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5438/gate2_test
      SCHOLARZONE_DATABASE_URL_RO: postgresql://gate2_ro:test@localhost:5438/gate2_test?sslmode=disable
      EXPECTED_NEON_PROJECT_ID: "test-project-18"
      EXPECTED_NEON_BRANCH_ID: "test-branch-18"
      EXPECTED_NEON_BRANCH_NAME: "main"
      EXPECTED_DATABASE_NAME: "gate2_test"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: gate2_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5438:5432
        options: >-
          --health-cmd="pg_isready -U test -d gate2_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libtiff5-dev libwebp-dev postgresql-client
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-v2-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          Linux-pip-v2-
    - name: Install dependencies
      run: cd backend && pip install -r requirements.txt
    - name: Install purge preflight test dependencies
      run: cd backend && pip install -r requirements-purge-preflight.txt
    - name: Wait for PostgreSQL to be ready
      run: |
        for i in {1..30}; do
          if pg_isready -h localhost -p 5438 -U test -d gate2_test; then
            echo "PostgreSQL 18 is ready"
            break
          fi
          echo "Waiting for PostgreSQL... ($i/30)"
          sleep 2
        done
    - name: Initialize database schema and test data
      run: |
        cd backend
        python scripts/init_gate2_test_db.py 2>&1 | tee gate2_init_test.log
    - name: Run Gate 2 Integration Test
      run: |
        cd backend
        python -m pytest tests/test_purge_preflight.py::test_gate2_integration_pg18_real_db -v --tb=short 2>&1 | tee gate2_integration_pg18_test.log
    - name: Verify Gate 2 test executed (not skipped)
      run: |
        cd backend
        if grep -q "SKIPPED" gate2_integration_pg18_test.log; then
          echo "ERROR: Gate 2 integration test was SKIPPED"
          cat gate2_integration_pg18_test.log
          exit 1
        fi
        if ! grep -q "PASSED\|PASS" gate2_integration_pg18_test.log; then
          echo "ERROR: Gate 2 integration test did not pass"
          cat gate2_integration_pg18_test.log
          exit 1
        fi
        echo "Gate 2 integration test (PG18) executed and passed"
    - name: Upload Gate 2 integration results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: gate2-integration-results-pg18
        path: |
          backend/gate2_result.json
          backend/gate2_integration_pg18_test.log
          backend/gate2_init_test.log
    - name: Upload Gate 2 logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: gate2-integration-failure-logs-pg18
        path: backend/gate2_integration_pg18_test.log


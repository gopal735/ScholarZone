name: ScholarZone CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      SCHOLARZONE_ENVIRONMENT: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libtiff5-dev libwebp-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-v2-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-v2-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Debug - verify pip install
        run: |
          cd backend
          pip list | grep -E "(fastapi|pydantic|sqlalchemy|psycopg|httpx|pillow|beautifulsoup4|apscheduler|resend|python-dotenv)" || true

      - name: Debug - test critical imports
        run: |
          cd backend
          python -c "import psycopg; print('psycopg: OK')" 2>&1 || echo "psycopg: FAIL"
          python -c "import sqlalchemy; print('sqlalchemy: OK')" 2>&1 || echo "sqlalchemy: FAIL"
          python -c "import fastapi; print('fastapi: OK')" 2>&1 || echo "fastapi: FAIL"
          python -c "import pydantic; print('pydantic: OK')" 2>&1 || echo "pydantic: FAIL"
          python -c "import httpx; print('httpx: OK')" 2>&1 || echo "httpx: FAIL"
          python -c "import PIL; print('PIL: OK')" 2>&1 || echo "PIL: FAIL"
          python -c "import bs4; print('bs4: OK')" 2>&1 || echo "bs4: FAIL"
          python -c "import apscheduler; print('apscheduler: OK')" 2>&1 || echo "apscheduler: FAIL"
          python -c "import resend; print('resend: OK')" 2>&1 || echo "resend: FAIL"
          python -c "import dotenv; print('dotenv: OK')" 2>&1 || echo "dotenv: FAIL"

      - name: Debug - verify environment
        run: |
          cd backend
          python -c "import sys; print(f'Python: {sys.version}'); import app; print('app import ok'); import pytest; print('pytest ok')" 2>&1

      - name: Debug - run simple test
        run: |
          cd backend
          python -m pytest tests/test_git_integrity_regression.py -v --tb=short 2>&1

      - name: Run backend tests
        run: |
          cd backend
          python -m pytest tests/ -x --tb=short

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-tests-logs
          path: backend/pytest.log

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-v2-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-v2-

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Run frontend lint
        run: |
          cd frontend
          npm run lint

      - name: Upload lint results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-lint-logs
          path: frontend/eslint.log

  import-smoke:
    runs-on: ubuntu-latest
    env:
      SCHOLARZONE_ENVIRONMENT: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libtiff5-dev libwebp-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run import smoke test
        run: |
          cd backend
          python scripts/import_smoke_test.py

      - name: Upload smoke test logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: import-smoke-logs
          path: backend/import_smoke_test.log

  git-integrity:
    runs-on: ubuntu-latest
    env:
      SCHOLARZONE_ENVIRONMENT: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run git integrity check
        run: python backend/scripts/git_integrity_check.py

      - name: Upload integrity logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: git-integrity-logs
          path: backend/git_integrity.log

  env-config:
    runs-on: ubuntu-latest
    env:
      SCHOLARZONE_ENVIRONMENT: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run env config check
        run: |
          cd backend
          python scripts/env_config_check.py

      - name: Upload env config logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: env-config-logs
          path: backend/env_config_check.log

  schema-compat:
    runs-on: ubuntu-latest
    env:
      SCHOLARZONE_ENVIRONMENT: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libtiff5-dev libwebp-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run schema compat check
        run: |
          cd backend
          python scripts/schema_compat_check.py

      - name: Upload schema compat logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: schema-compat-logs
          path: backend/schema_compat_check.log

  build-and-smoke:
    runs-on: ubuntu-latest
    env:
      SCHOLARZONE_ENVIRONMENT: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libtiff5-dev libwebp-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Build Docker image
        run: |
          cd backend
          docker build -t scholarzone-api:${{ github.sha }} -t scholarzone-api:latest .

      - name: Run artifact smoke test
        run: |
          cd backend
          python scripts/artifact_smoke_test.py

      - name: Upload smoke test logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-and-smoke-logs
          path: backend/artifact_smoke_test.log

  preflight:
    runs-on: ubuntu-latest
    env:
      SCHOLARZONE_ENVIRONMENT: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libtiff5-dev libwebp-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run preflight
        run: python backend/scripts/preflight.py

      - name: Upload preflight logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: preflight-logs
          path: backend/preflight.log
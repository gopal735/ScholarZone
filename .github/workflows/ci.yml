name: ScholarZone CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

# `shell: bash` runs every step as `bash --noprofile --norc -eo pipefail {0}`.
# GitHub's *default* shell on Linux is `bash -e {0}`, which does NOT set pipefail.
# That difference is invisible until a step pipes: a pipeline reports the exit
# status of its last command, so `some_check.py 2>&1 | tee check.log` recorded
# tee's status - which is always 0 - and a failing check was reported green.
#
# Fixing the backend test step alone was not enough. Six more steps in this
# workflow had the same shape and the same hole, and one of them was preflight:
# the gate whose entire purpose is to catch a failing check. Each of the
# producers below returns a correct non-zero exit code - the tee was throwing it
# away.
#
#   job                producer                     check name
#   backend-tests      pytest                       backend-tests
#   import-smoke       import_smoke_test.py         import-smoke
#   git-integrity      git_integrity_check.py       git-integrity
#   env-config         env_config_check.py          env-config
#   schema-compat      schema_compat_check.py       schema-compat
#   build-and-smoke    artifact_smoke_test.py       build-and-smoke
#   preflight          preflight.py                 preflight
#
# Declared once at the workflow level, so the invariant is a property of the
# workflow rather than something each step has to remember:
#
#     producer exits non-zero -> step exits non-zero -> job exits non-zero
#                               -> the PR check fails
#     producer exits zero     -> step succeeds
#
# Measured, not assumed: with a producer exiting 1, the default shell records 0
# and this one records 1; with a producer exiting 0 both record 0, so this adds
# no false reds. tee still captures the output either way, so the `if: failure()`
# artifact uploads are unaffected.
#
# The per-step `set -o pipefail` lines below are kept: they are now redundant
# rather than wrong, and they keep the rule intact if a step is ever copied into
# a workflow that has not declared the default.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      SCHOLARZONE_ENVIRONMENT: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libtiff5-dev libwebp-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-v2-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-v2-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Debug - verify pip install
        run: |
          cd backend
          pip list | grep -E "(fastapi|pydantic|sqlalchemy|psycopg|httpx|pillow|beautifulsoup4|apscheduler|resend|python-dotenv)" || true

      - name: Debug - test critical imports
        run: |
          cd backend
          python -c "import psycopg; print('psycopg: OK')" 2>&1 || echo "psycopg: FAIL"
          python -c "import sqlalchemy; print('sqlalchemy: OK')" 2>&1 || echo "sqlalchemy: FAIL"
          python -c "import fastapi; print('fastapi: OK')" 2>&1 || echo "fastapi: FAIL"
          python -c "import pydantic; print('pydantic: OK')" 2>&1 || echo "pydantic: FAIL"
          python -c "import httpx; print('httpx: OK')" 2>&1 || echo "httpx: FAIL"
          python -c "import PIL; print('PIL: OK')" 2>&1 || echo "PIL: FAIL"
          python -c "import bs4; print('bs4: OK')" 2>&1 || echo "bs4: FAIL"
          python -c "import apscheduler; print('apscheduler: OK')" 2>&1 || echo "apscheduler: FAIL"
          python -c "import resend; print('resend: OK')" 2>&1 || echo "resend: FAIL"
          python -c "import dotenv; print('dotenv: OK')" 2>&1 || echo "dotenv: FAIL"

      - name: Debug - verify environment
        run: |
          cd backend
          python -c "import sys; print(f'Python: {sys.version}'); import app; print('app import ok'); import pytest; print('pytest ok')" 2>&1

      - name: Debug - run simple test
        run: |
          cd backend
          python -m pytest tests/test_git_integrity_regression.py -v --tb=short 2>&1

      - name: Run backend tests
        run: |
          cd backend
          # pipefail, not a bare pipe. `pytest ... | tee log` reports the exit
          # status of tee, which is always 0 - so a failing backend suite was
          # reported green. This step was the one the frontend step below was
          # already guarding against; both now use the same rule. It is also set
          # workflow-wide under `defaults:` further up.
          set -o pipefail
          # No `-x`. This job is the backend release gate, so its result has to
          # mean "the selected suite passed" rather than "it stopped at the first
          # thing that went wrong". With `-x` the run that first restored the
          # real exit code reported `1 failed, 259 passed` and then stopped -
          # 261 of the 5517 tests collected under tests/ never ran, so the green
          # half of that result said nothing about the other 95%. Run the whole
          # selection, so the collection count, the execution count and the exit
          # code are one statement rather than three.
          python -m pytest tests/ --tb=short 2>&1 | tee pytest.log

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-tests-logs
          path: backend/pytest.log

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-v2-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-v2-

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Run frontend lint
        run: |
          cd frontend
          npm run lint

      - name: Upload lint results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-lint-logs
          path: frontend/eslint.log

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend tests
        run: |
          cd frontend
          # pipefail, not a bare pipe. `npm run test | tee log` reports the exit
          # status of tee, which is always 0 - so a failing suite would be
          # reported green, which is exactly what the backend step above does.
          set -o pipefail
          npm run test 2>&1 | tee vitest.log

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-test-logs
          path: frontend/vitest.log

  import-smoke:
    runs-on: ubuntu-latest
    env:
      SCHOLARZONE_ENVIRONMENT: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libtiff5-dev libwebp-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run import smoke test
        run: |
          cd backend
          python scripts/import_smoke_test.py 2>&1 | tee import_smoke_test.log

      - name: Upload smoke test logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: import-smoke-logs
          path: backend/import_smoke_test.log

  git-integrity:
    runs-on: ubuntu-latest
    env:
      SCHOLARZONE_ENVIRONMENT: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run git integrity check
        run: python backend/scripts/git_integrity_check.py 2>&1 | tee backend/git_integrity.log

      - name: Upload integrity logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: git-integrity-logs
          path: backend/git_integrity.log

  env-config:
    runs-on: ubuntu-latest
    env:
      SCHOLARZONE_ENVIRONMENT: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run env config check
        run: |
          cd backend
          python scripts/env_config_check.py 2>&1 | tee env_config_check.log

      - name: Upload env config logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: env-config-logs
          path: backend/env_config_check.log

  schema-compat:
    runs-on: ubuntu-latest
    env:
      SCHOLARZONE_ENVIRONMENT: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libtiff5-dev libwebp-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run schema compat check
        run: |
          cd backend
          python scripts/schema_compat_check.py 2>&1 | tee schema_compat_check.log

      - name: Upload schema compat logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: schema-compat-logs
          path: backend/schema_compat_check.log

  build-and-smoke:
    runs-on: ubuntu-latest
    env:
      SCHOLARZONE_ENVIRONMENT: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libtiff5-dev libwebp-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Build Docker image
        run: |
          cd backend
          docker build -t scholarzone-api:${{ github.sha }} -t scholarzone-api:latest .

      - name: Run artifact smoke test
        run: |
          cd backend
          python scripts/artifact_smoke_test.py 2>&1 | tee artifact_smoke_test.log

      - name: Upload smoke test logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-and-smoke-logs
          path: backend/artifact_smoke_test.log

  preflight:
    runs-on: ubuntu-latest
    env:
      SCHOLARZONE_ENVIRONMENT: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libtiff5-dev libwebp-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run preflight
        run: |
          python backend/scripts/preflight.py 2>&1 | tee backend/preflight.log

      - name: Upload preflight logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: preflight-logs
          path: backend/preflight.log
name: Duplicate Archive PostgreSQL Validation

'on':
  pull_request:
    branches:
      - main
      - master
      - fix/scholarzone-global-dedup-closure
  push:
    branches:
      - main
      - master
      - fix/scholarzone-global-dedup-closure
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  duplicate-archive-postgresql:
    name: Duplicate Archive PostgreSQL ${{ matrix.pg-version }}
    runs-on: ubuntu-latest
    env:
      SCHOLARZONE_ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5439/test_duplicate_archive
    services:
      postgres:
        image: postgres:${{ matrix.pg-version }}
        env:
          POSTGRES_DB: test_duplicate_archive
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5439:5432
        options: >-
          --health-cmd="pg_isready -U test -d test_duplicate_archive"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    strategy:
      matrix:
        pg-version: ['16', '18']
      fail-fast: false
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libtiff5-dev libwebp-dev postgresql-client

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-v2-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          Linux-pip-v2-

    - name: Install dependencies
      run: cd backend && pip install -r requirements.txt

    - name: Verify pip install
      run: |
        cd backend && pip list | grep -E "(fastapi|pydantic|sqlalchemy|psycopg2|httpx)" || true
        python -c "import psycopg2; print('psycopg2: OK')" 2>&1 || echo "psycopg2: FAIL"

    - name: Verify environment
      run: |
        cd backend && python -c "import sys; print(f'Python: {sys.version}'); import app; print('app import ok')"

    - name: Wait for PostgreSQL to be ready
      run: |
        for i in $(seq 1 30); do
          if pg_isready -h localhost -p 5439 -U test -d test_duplicate_archive; then
            echo "PostgreSQL ${{ matrix.pg-version }} is ready"
            break
          fi
          echo "Waiting for PostgreSQL... ($i/30)"
          sleep 2
        done

    - name: Run duplicate archive PostgreSQL tests
      run: |
        cd backend
        python -m pytest tests/test_duplicate_archive_postgresql.py -v --tb=short 2>&1 | tee duplicate_archive_postgresql_test.log

    - name: Verify duplicate archive tests passed
      run: |
        cd backend
        if grep -q "SKIPPED" duplicate_archive_postgresql_test.log; then
          echo "ERROR: Duplicate archive test was SKIPPED - TEST_DATABASE_URL may not be set correctly"
          cat duplicate_archive_postgresql_test.log
          exit 1
        fi
        if ! grep -q "passed" duplicate_archive_postgresql_test.log; then
          echo "ERROR: Duplicate archive tests did not pass"
          cat duplicate_archive_postgresql_test.log
          exit 1
        fi
        echo "Duplicate archive PostgreSQL tests executed and passed"

    - name: Upload duplicate archive test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: duplicate-archive-postgresql-results-pg${{ matrix.pg-version }}
        path: |
          backend/duplicate_archive_postgresql_test.log

    - name: Upload test logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: duplicate-archive-postgresql-failure-logs-pg${{ matrix.pg-version }}
        path: backend/duplicate_archive_postgresql_test.log
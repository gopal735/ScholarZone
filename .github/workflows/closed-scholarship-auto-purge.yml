name: Closed Scholarship Automatic Production Purge (PR #107)

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: read
  id-token: write
  actions: read
  checks: write

concurrency:
  group: closed-scholarship-auto-purge-pr107
  cancel-in-progress: false

env:
  SCHOLARZONE_ENVIRONMENT: production

jobs:
  verify-merge-trigger:
    name: Verify PR #107 Merge Trigger
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      pr_number: ${{ steps.check.outputs.pr_number }}
      merge_commit_sha: ${{ steps.check.outputs.merge_commit_sha }}
      head_sha: ${{ steps.check.outputs.head_sha }}
    steps:
      - name: Verify PR #107 merge conditions
        id: check
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_NUMBER: ${{ github.event.number }}
          EVENT_MERGED: ${{ github.event.pull_request.merged }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [ "$EVENT_REPOSITORY" != "gopal735/ScholarZone" ]; then
            echo "ERROR: Wrong repository: $EVENT_REPOSITORY"
            exit 1
          fi

          if [ "$EVENT_NUMBER" != "107" ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "pr_number=$EVENT_NUMBER" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$EVENT_MERGED" != "true" ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "pr_number=107" >> $GITHUB_OUTPUT
            echo "PR #107 was closed but not merged"
            exit 0
          fi

          if [ "$EVENT_BASE_REF" != "master" ]; then
            echo "ERROR: Base branch is not master"
            exit 1
          fi

          if [ "$EVENT_HEAD_REF" != "feat/closed-scholarship-permanent-deletion" ]; then
            echo "ERROR: Unexpected feature branch: $EVENT_HEAD_REF"
            exit 1
          fi

          if [ -z "$EVENT_MERGE_SHA" ] || [ "$EVENT_MERGE_SHA" = "null" ]; then
            echo "ERROR: Merge commit SHA not available"
            exit 1
          fi

          if [ -z "$EVENT_HEAD_SHA" ] || [ "$EVENT_HEAD_SHA" = "null" ]; then
            echo "ERROR: Head SHA not available"
            exit 1
          fi

          # Validate SHA format: exactly 40 lowercase hexadecimal characters.
          if ! printf '%s' "$EVENT_MERGE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: Invalid merge commit SHA format"
            exit 1
          fi
          if ! printf '%s' "$EVENT_HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: Invalid head SHA format"
            exit 1
          fi

          MERGE_COMMIT_SHA="$EVENT_MERGE_SHA"
          HEAD_SHA="$EVENT_HEAD_SHA"

          echo "should_run=true" >> $GITHUB_OUTPUT
          echo "pr_number=107" >> $GITHUB_OUTPUT
          echo "merge_commit_sha=$MERGE_COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT

          echo "PR #107 merge verified:"
          echo "  Merge commit: $MERGE_COMMIT_SHA"
          echo "  Head SHA: $HEAD_SHA"
          echo "  Base: master"

      - name: Verify workflow revision matches merged PR
        if: steps.check.outputs.should_run == 'true'
        run: |
          MERGE_COMMIT_SHA="${{ steps.check.outputs.merge_commit_sha }}"
          git fetch origin $MERGE_COMMIT_SHA --depth=1
          if git show $MERGE_COMMIT_SHA:.github/workflows/closed-scholarship-auto-purge.yml >/dev/null 2>&1; then
            echo "Workflow exists in merge commit - revision verified"
          else
            echo "ERROR: Workflow not found in merge commit - possible stale workflow"
            exit 1
          fi
          git fetch origin master --depth=50
          if git merge-base --is-ancestor $MERGE_COMMIT_SHA origin/master; then
            echo "Merge commit reachable from origin/master"
          else
            echo "ERROR: Merge commit not reachable from origin/master"
            exit 1
          fi

  preflight-gate1-atomicity:
    name: Gate 1 - Atomicity and Rollback
    needs: verify-merge-trigger
    if: needs.verify-merge-trigger.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_purge
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d test_purge"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test_purge
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.verify-merge-trigger.outputs.merge_commit_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install psycopg2-binary --quiet
          pip install -r backend/requirements.txt --quiet

      - name: Verify Atomicity and Rollback
        id: atomicity
        run: python .github/scripts/gate1_atomicity.py

      - name: Upload Gate 1 Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate1-atomicity-result
          path: gate1_result.json
          retention-days: 7

  preflight-gate2-identity:
    name: Gate 2 - Production Identity Verification
    needs: verify-merge-trigger
    if: needs.verify-merge-trigger.outputs.should_run == 'true'
    environment:
      name: production-readonly
      url: https://console.neon.tech
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      SCHOLARZONE_DATABASE_URL_RO: ${{ secrets.SCHOLARZONE_DATABASE_URL_RO }}
      EXPECTED_NEON_PROJECT_ID: ${{ secrets.EXPECTED_NEON_PROJECT_ID }}
      EXPECTED_NEON_BRANCH_ID: ${{ secrets.EXPECTED_NEON_BRANCH_ID }}
      EXPECTED_NEON_BRANCH_NAME: ${{ secrets.EXPECTED_NEON_BRANCH_NAME }}
      EXPECTED_DATABASE_NAME: ${{ secrets.EXPECTED_DATABASE_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.verify-merge-trigger.outputs.merge_commit_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install psycopg2-binary --quiet
          pip install -r backend/requirements.txt --quiet

      - name: Verify Production Identity
        id: identity
        run: python .github/scripts/gate2_identity.py

      - name: Upload Gate 2 Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2-identity-result
          path: gate2_result.json
          retention-days: 7

  preflight-gate3-dependencies:
    name: Gate 3 - Production Dependencies Verification
    needs: [verify-merge-trigger, generate-manifest]
    if: needs.verify-merge-trigger.outputs.should_run == 'true'
    environment: production-readonly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCHOLARZONE_DATABASE_URL_RO: ${{ secrets.SCHOLARZONE_DATABASE_URL_RO }}
      EXPECTED_NEON_PROJECT_ID: ${{ secrets.EXPECTED_NEON_PROJECT_ID }}
      EXPECTED_NEON_BRANCH_ID: ${{ secrets.EXPECTED_NEON_BRANCH_ID }}
      EXPECTED_NEON_BRANCH_NAME: ${{ secrets.EXPECTED_NEON_BRANCH_NAME }}
      EXPECTED_DATABASE_NAME: ${{ secrets.EXPECTED_DATABASE_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.verify-merge-trigger.outputs.merge_commit_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install psycopg2-binary --quiet
          pip install -r backend/requirements.txt --quiet

      - name: Download Manifest Artifact
        uses: actions/download-artifact@v4
        with:
          name: deletion-manifest
          path: artifacts



      - name: Verify Production Dependencies
        id: deps
        run: python .github/scripts/gate3_dependencies.py

      - name: Upload Gate 3 Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate3-dependencies-result
          path: gate3_result.json
          retention-days: 7

  preflight-gate4-backup:
    name: Gate 4 - Production Backup & Verification
    needs: [verify-merge-trigger, generate-manifest]
    if: needs.verify-merge-trigger.outputs.should_run == 'true'
    environment:
      name: production-backup
      url: https://console.neon.tech
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      SCHOLARZONE_DATABASE_URL_BACKUP: ${{ secrets.SCHOLARZONE_DATABASE_URL_BACKUP }}
      GPG_RECIPIENT: ${{ secrets.GPG_RECIPIENT }}
      GPG_EXPECTED_FINGERPRINT: ${{ secrets.GPG_EXPECTED_FINGERPRINT }}
      EXPECTED_NEON_PROJECT_ID: ${{ secrets.EXPECTED_NEON_PROJECT_ID }}
      EXPECTED_NEON_BRANCH_ID: ${{ secrets.EXPECTED_NEON_BRANCH_ID }}
      EXPECTED_NEON_BRANCH_NAME: ${{ secrets.EXPECTED_NEON_BRANCH_NAME }}
      EXPECTED_DATABASE_NAME: ${{ secrets.EXPECTED_DATABASE_NAME }}
      RESTORE_TEST_PGHOST: ${{ secrets.RESTORE_TEST_PGHOST }}
      RESTORE_TEST_PGPORT: ${{ secrets.RESTORE_TEST_PGPORT }}
      RESTORE_TEST_PGUSER: ${{ secrets.RESTORE_TEST_PGUSER }}
      RESTORE_TEST_PGPASSWORD: ${{ secrets.RESTORE_TEST_PGPASSWORD }}
      DURABLE_STORAGE_PROVIDER: ${{ secrets.DURABLE_STORAGE_PROVIDER }}
      DURABLE_STORAGE_BUCKET: ${{ secrets.DURABLE_STORAGE_BUCKET }}
      DURABLE_STORAGE_REGION: ${{ secrets.DURABLE_STORAGE_REGION }}
      DURABLE_STORAGE_CREDENTIAL: ${{ secrets.DURABLE_STORAGE_CREDENTIAL }}
      DURABLE_STORAGE_CREDENTIAL_SECRET: ${{ secrets.DURABLE_STORAGE_CREDENTIAL_SECRET }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.verify-merge-trigger.outputs.merge_commit_sha }}

      - name: Azure OIDC Login
        if: env.DURABLE_STORAGE_PROVIDER == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Install PostgreSQL client and GPG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client gnupg > /dev/null 2>&1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt --quiet

      - name: Download Manifest Artifact
        uses: actions/download-artifact@v4
        with:
          name: deletion-manifest
          path: artifacts



      - name: Verify Neon PITR & Create Encrypted Backup
        id: backup
        run: python .github/scripts/gate4_backup.py

      - name: Upload Gate 4 Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate4-backup-result
          path: |
            gate4_result.json
            *.sha256
          retention-days: 30

  preflight-gate5-classification:
    name: Gate 5 - Target Classification Validation
    needs: [verify-merge-trigger, generate-manifest]
    if: needs.verify-merge-trigger.outputs.should_run == 'true'
    environment: production-readonly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCHOLARZONE_DATABASE_URL_RO: ${{ secrets.SCHOLARZONE_DATABASE_URL_RO }}
      EXPECTED_NEON_PROJECT_ID: ${{ secrets.EXPECTED_NEON_PROJECT_ID }}
      EXPECTED_NEON_BRANCH_ID: ${{ secrets.EXPECTED_NEON_BRANCH_ID }}
      EXPECTED_NEON_BRANCH_NAME: ${{ secrets.EXPECTED_NEON_BRANCH_NAME }}
      EXPECTED_DATABASE_NAME: ${{ secrets.EXPECTED_DATABASE_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.verify-merge-trigger.outputs.merge_commit_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install psycopg2-binary --quiet
          pip install -r backend/requirements.txt --quiet

      - name: Download Manifest Artifact
        uses: actions/download-artifact@v4
        with:
          name: deletion-manifest
          path: artifacts



      - name: Validate Target Classification
        id: classification
        run: python .github/scripts/gate5_classification.py

      - name: Upload Gate 5 Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate5-classification-result
          path: gate5_result.json
          retention-days: 7

  preflight-gate6-cycle-validation:
    name: Gate 6 - Application Cycle Validation
    needs: [verify-merge-trigger, generate-manifest]
    if: needs.verify-merge-trigger.outputs.should_run == 'true'
    environment: production-readonly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCHOLARZONE_DATABASE_URL_RO: ${{ secrets.SCHOLARZONE_DATABASE_URL_RO }}
      EXPECTED_NEON_PROJECT_ID: ${{ secrets.EXPECTED_NEON_PROJECT_ID }}
      EXPECTED_NEON_BRANCH_ID: ${{ secrets.EXPECTED_NEON_BRANCH_ID }}
      EXPECTED_NEON_BRANCH_NAME: ${{ secrets.EXPECTED_NEON_BRANCH_NAME }}
      EXPECTED_DATABASE_NAME: ${{ secrets.EXPECTED_DATABASE_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.verify-merge-trigger.outputs.merge_commit_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install psycopg2-binary --quiet
          pip install -r backend/requirements.txt --quiet

      - name: Download Manifest Artifact
        uses: actions/download-artifact@v4
        with:
          name: deletion-manifest
          path: artifacts



      - name: Validate Application Cycles
        id: cycle
        run: python .github/scripts/gate6_cycle_validation.py

      - name: Upload Gate 6 Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate6-cycle-validation-result
          path: gate6_result.json
          retention-days: 7

  preflight-gate7-git-safety:
    name: Gate 7 - Git Safety Verification
    needs: verify-merge-trigger
    if: needs.verify-merge-trigger.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.verify-merge-trigger.outputs.merge_commit_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt --quiet

      - name: Verify Git Safety
        id: gitsafety
        run: python .github/scripts/gate7_git_safety.py

      - name: Upload Gate 7 Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate7-git-safety-result
          path: gate7_result.json
          retention-days: 7

  preflight-summary:
    name: Preflight Summary & Gate Status
    needs: [verify-merge-trigger, preflight-gate1-atomicity, preflight-gate2-identity, preflight-gate3-dependencies, preflight-gate4-backup, preflight-gate5-classification, preflight-gate6-cycle-validation, preflight-gate7-git-safety, validate-manifest]
    if: needs.verify-merge-trigger.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.verify-merge-trigger.outputs.merge_commit_sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Final Preflight Report
        run: |
          python .github/scripts/summary.py artifacts ${{ needs.verify-merge-trigger.outputs.merge_commit_sha }} ${{ github.run_id }} ${{ github.run_number }} ${{ github.run_attempt }} ${{ github.workflow }}

      - name: Upload Preflight Summary
        uses: actions/upload-artifact@v4
        with:
          name: preflight-summary
          path: |
            artifacts/gate1_result.json
            artifacts/gate2_result.json
            artifacts/gate3_result.json
            artifacts/gate4_result.json
            artifacts/gate5_result.json
            artifacts/gate6_result.json
            artifacts/gate7_result.json
            preflight_summary.json
          retention-days: 30

      - name: Check Overall Preflight Status
        run: python .github/scripts/check_preflight_status.py

  generate-manifest:
    name: Generate Dynamic Deletion Manifest
    needs: [verify-merge-trigger, preflight-gate2-identity]
    if: needs.verify-merge-trigger.outputs.should_run == 'true'
    environment: production-readonly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      manifest_hash: ${{ steps.manifest.outputs.manifest_hash }}
      total_closed: ${{ steps.manifest.outputs.total_closed }}
      schema_version: ${{ steps.manifest.outputs.schema_version }}
      reference_date: ${{ steps.manifest.outputs.reference_date }}
      manifest_path: ${{ steps.manifest.outputs.manifest_path }}
    env:
      SCHOLARZONE_DATABASE_URL_RO: ${{ secrets.SCHOLARZONE_DATABASE_URL_RO }}
      EXPECTED_NEON_PROJECT_ID: ${{ secrets.EXPECTED_NEON_PROJECT_ID }}
      EXPECTED_NEON_BRANCH_ID: ${{ secrets.EXPECTED_NEON_BRANCH_ID }}
      EXPECTED_NEON_BRANCH_NAME: ${{ secrets.EXPECTED_NEON_BRANCH_NAME }}
      EXPECTED_DATABASE_NAME: ${{ secrets.EXPECTED_DATABASE_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.verify-merge-trigger.outputs.merge_commit_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install psycopg2-binary --quiet
          pip install -r backend/requirements.txt --quiet

      - name: Generate Dynamic Deletion Manifest
        id: manifest
        run: python .github/scripts/generate_manifest.py

      - name: Upload Manifest
        uses: actions/upload-artifact@v4
        with:
          name: deletion-manifest
          path: |
            artifacts/deletion_manifest.json
            artifacts/manifest_metadata.json
          retention-days: 30

  validate-manifest:
    name: Validate Manifest Stability
    needs: [verify-merge-trigger, generate-manifest]
    if: needs.verify-merge-trigger.outputs.should_run == 'true'
    environment: production-readonly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCHOLARZONE_DATABASE_URL_RO: ${{ secrets.SCHOLARZONE_DATABASE_URL_RO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.verify-merge-trigger.outputs.merge_commit_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install psycopg2-binary --quiet
          pip install -r backend/requirements.txt --quiet

      - name: Download Manifest
        uses: actions/download-artifact@v4
        with:
          name: deletion-manifest
          path: artifacts

      - name: Validate Manifest Stability
        id: validate
        run: python .github/scripts/validate_manifest.py

  execute-deletion:
    name: Execute Production Deletion
    needs: [verify-merge-trigger, generate-manifest, validate-manifest, preflight-summary]
    if: needs.verify-merge-trigger.outputs.should_run == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCHOLARZONE_ENVIRONMENT: production
      SCHOLARZONE_DATABASE_URL: ${{ secrets.SCHOLARZONE_DATABASE_URL }}
      EXPECTED_NEON_PROJECT_ID: ${{ secrets.EXPECTED_NEON_PROJECT_ID }}
      EXPECTED_NEON_BRANCH_ID: ${{ secrets.EXPECTED_NEON_BRANCH_ID }}
      EXPECTED_NEON_BRANCH_NAME: ${{ secrets.EXPECTED_NEON_BRANCH_NAME }}
      EXPECTED_DATABASE_NAME: ${{ secrets.EXPECTED_DATABASE_NAME }}
      EXPECTED_DATABASE_HOST: ${{ secrets.EXPECTED_DATABASE_HOST }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.generate-manifest.outputs.manifest_hash }}
      EXPECTED_MANIFEST_COUNT: ${{ needs.generate-manifest.outputs.total_closed }}
      EXPECTED_MANIFEST_SCHEMA_VERSION: ${{ needs.generate-manifest.outputs.schema_version }}
      EXPECTED_MANIFEST_REFERENCE_DATE: ${{ needs.generate-manifest.outputs.reference_date }}
    outputs:
      deleted_count: ${{ steps.deletion.outputs.deleted_count }}
      report_path: ${{ steps.deletion.outputs.report_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.verify-merge-trigger.outputs.merge_commit_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt --quiet

      - name: Download Manifest
        uses: actions/download-artifact@v4
        with:
          name: deletion-manifest
          path: artifacts

      - name: Execute Production Deletion
        id: deletion
        run: python .github/scripts/execute_deletion.py
        env:
          MERGE_COMMIT_SHA: ${{ needs.verify-merge-trigger.outputs.merge_commit_sha }}

      - name: Upload Deletion Report
        uses: actions/upload-artifact@v4
        with:
          name: deletion-report
          path: |
            deletion_report.json
          retention-days: 90

  regenerate-snapshot:
    name: Regenerate Public Snapshot & Sitemap
    needs: [verify-merge-trigger, execute-deletion]
    if: needs.verify-merge-trigger.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.verify-merge-trigger.outputs.merge_commit_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libtiff5-dev libwebp-dev

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node.js dependencies
        working-directory: frontend
        run: |
          npm ci
          npx eslint --version

      - name: Generate public snapshot from production
        working-directory: backend
        env:
          SCHOLARZONE_ENVIRONMENT: production
          SCHOLARZONE_DATABASE_URL: ${{ secrets.SCHOLARZONE_DATABASE_URL }}
        run: |
          python scripts/build_public_snapshot.py

      - name: Validate snapshot structure
        working-directory: frontend
        run: node .github/scripts/validate_snapshot.js

      - name: Generate sitemap from snapshot
        working-directory: frontend
        run: node scripts/build-sitemap.mjs

      - name: Validate sitemap
        working-directory: frontend
        run: node .github/scripts/validate_sitemap.js

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend to verify static assets
        working-directory: frontend
        env:
          VITE_DEPLOY_TARGET: github-pages
          VITE_API_BASE_URL: https://scholarzone-fwzj.vercel.app/api
        run: npm run build

      - name: Commit snapshot and sitemap if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet frontend/public/scholarships-snapshot.json frontend/public/sitemap.xml; then
            git add frontend/public/scholarships-snapshot.json frontend/public/sitemap.xml
            git commit -m "chore(catalogue): regenerate public snapshot and sitemap after PR #107 purge [skip ci]"
            git push
            echo "Snapshot and sitemap committed and pushed"
          else
            echo "No changes to snapshot/sitemap"
          fi

  final-report:
    name: Final Execution Report
    needs: [verify-merge-trigger, preflight-summary, generate-manifest, validate-manifest, execute-deletion, regenerate-snapshot]
    if: needs.verify-merge-trigger.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.verify-merge-trigger.outputs.merge_commit_sha }}

      - name: Download Manifest Artifact
        uses: actions/download-artifact@v4
        with:
          name: deletion-manifest
          path: artifacts

      - name: Download Deletion Report Artifact
        uses: actions/download-artifact@v4
        with:
          name: deletion-report
          path: artifacts

      - name: Generate Final Execution Report
        run: python .github/scripts/generate_final_report.py

      - name: Upload Final Report
        uses: actions/upload-artifact@v4
        with:
          name: final-execution-report
          path: artifacts/
          retention-days: 90



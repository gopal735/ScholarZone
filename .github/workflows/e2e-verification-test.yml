name: E2E Verification Test

on:
  workflow_dispatch:

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.SCHOLARZONE_API_URL }}
      SECRET: ${{ secrets.SCHOLARZONE_VERIFICATION_SECRET }}
      DATABASE_URL: ${{ secrets.SCHOLARZONE_DATABASE_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install sqlalchemy psycopg

      - name: Capture BEFORE state (API)
        run: |
          echo "=== API BEFORE STATE ==="
          curl -s --max-time 30 "$API_URL/health"
          echo ""
          curl -s --max-time 30 "$API_URL/scholarships" | python -c "import sys,json; d=json.load(sys.stdin); print('Total scholarships:', d.get('pagination',{}).get('total'))"
          echo ""
          curl -s --max-time 30 "$API_URL/internal/verify/status"
          echo ""

      - name: Capture BEFORE state (Database)
        run: |
          cd backend
          python scripts/db_state.py

      - name: Wait for rate-limit window (60s minimum)
        run: |
          echo "Waiting 65 seconds to ensure we're past the 60s rate limit..."
          sleep 65

      - name: Trigger ONE verification run
        run: |
          echo "=== TRIGGERING VERIFICATION ==="
          MAX_ATTEMPTS=3
          RETRY_DELAY=15
          SUCCESS=0

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $attempt of $MAX_ATTEMPTS..."

            HTTP_CODE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
              --connect-timeout 15 \
              --max-time 300 \
              --retry 0 \
              -X POST \
              -H "X-Verification-Secret: $SECRET" \
              -H "Content-Type: application/json" \
              "$API_URL/internal/verify/trigger")

            echo "HTTP response code: $HTTP_CODE"

            if [ "$HTTP_CODE" = "202" ]; then
              echo "Verification round accepted."
              cat /tmp/response.json
              SUCCESS=1
              break
            elif [ "$HTTP_CODE" = "429" ]; then
              echo "Rate-limited (429). Verification already in progress or too recent."
              cat /tmp/response.json
              # Wait and retry
              if [ $attempt -lt $MAX_ATTEMPTS ]; then
                echo "Waiting ${RETRY_DELAY}s before retry..."
                sleep $RETRY_DELAY
              fi
            elif [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
              echo "Authentication failed! HTTP $HTTP_CODE"
              cat /tmp/response.json
              exit 1
            elif [ "$HTTP_CODE" = "503" ]; then
              echo "Service unavailable (503). Container warming up."
              if [ $attempt -lt $MAX_ATTEMPTS ]; then
                echo "Waiting ${RETRY_DELAY}s before retry..."
                sleep $RETRY_DELAY
              fi
            elif [ "$HTTP_CODE" = "000" ]; then
              echo "Connection failed."
              if [ $attempt -lt $MAX_ATTEMPTS ]; then
                echo "Waiting ${RETRY_DELAY}s before retry..."
                sleep $RETRY_DELAY
              fi
            else
              echo "Unexpected response code: $HTTP_CODE"
              cat /tmp/response.json
              if [ $attempt -lt $MAX_ATTEMPTS ]; then
                echo "Waiting ${RETRY_DELAY}s before retry..."
                sleep $RETRY_DELAY
              fi
            fi
          done

          if [ $SUCCESS -eq 0 ]; then
            echo "::error::All $MAX_ATTEMPTS attempts failed."
            cat /tmp/response.json
            exit 1
          fi

      - name: Capture AFTER state (API)
        run: |
          echo "=== API AFTER STATE ==="
          curl -s --max-time 30 "$API_URL/health"
          echo ""
          curl -s --max-time 30 "$API_URL/scholarships" | python -c "import sys,json; d=json.load(sys.stdin); print('Total scholarships:', d.get('pagination',{}).get('total'))"
          echo ""
          curl -s --max-time 30 "$API_URL/internal/verify/status"
          echo ""

      - name: Capture AFTER state (Database)
        run: |
          cd backend
          python scripts/db_state.py

      - name: Test Authentication - Missing Secret
        run: |
          echo "=== AUTH TEST: Missing Secret ==="
          HTTP_CODE=$(curl -s -o /tmp/no_secret.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            "$API_URL/internal/verify/trigger")
          echo "HTTP response code (missing secret): $HTTP_CODE"
          cat /tmp/no_secret.json
          echo ""

      - name: Test Authentication - Wrong Secret
        run: |
          echo "=== AUTH TEST: Wrong Secret ==="
          HTTP_CODE=$(curl -s -o /tmp/wrong_secret.json -w "%{http_code}" \
            -X POST \
            -H "X-Verification-Secret: wrong-secret-12345" \
            -H "Content-Type: application/json" \
            "$API_URL/internal/verify/trigger")
          echo "HTTP response code (wrong secret): $HTTP_CODE"
          cat /tmp/wrong_secret.json
          echo ""

name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [ "master" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
        env:
          # The API host is configuration, not a build detail of this file. It
          # was hardcoded to one provider's container hostname, which meant the
          # repository itself depended on that provider staying in service.
          # Reading it from the repository variable keeps GitHub Pages working as
          # the rollback path and lets the API move provider by changing one
          # value, with no code change and no rebuild of the frontend logic.
          VITE_API_BASE_URL: ${{ vars.SCHOLARZONE_API_URL }}
          # GitHub Pages serves from a repository subpath.
          VITE_DEPLOY_TARGET: github-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

name: ScholarZone Native GitHub Deployment Verification

on:
  workflow_run:
    workflows: [ScholarZone CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  actions: read

concurrency:
  group: production-deployment-verification
  cancel-in-progress: true

jobs:
  verify-native-github-deployment:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production
    env:
      SCHOLARZONE_API_URL: ${{ vars.SCHOLARZONE_API_URL }}
    steps:
      - name: Validate production configuration
        run: |
          set -euo pipefail

          if [ -z "$SCHOLARZONE_API_URL" ]; then
            echo "::error::SCHOLARZONE_API_URL repository variable is not set."
            exit 1
          fi

          echo "Verifying the deployed API at the configured SCHOLARZONE_API_URL."
          echo "This check is host-agnostic: it proves the running build matches"
          echo "this commit regardless of which platform serves it."

      - name: Wait for deployment to become healthy AND current
        env:
          # The commit this workflow is verifying. A deployment that is healthy
          # but serving an older build is a failed deployment, not a success.
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail

          MAX_ATTEMPTS=40
          DELAY=15
          CURRENT=""

          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Health check attempt $i of $MAX_ATTEMPTS (expecting revision ${EXPECTED_REVISION})..."
            HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" \
              --connect-timeout 10 \
              --max-time 20 \
              -H "Cache-Control: no-cache" \
              -H "X-Cache-Bypass: 1" \
              "$SCHOLARZONE_API_URL/health" || true)
            echo "Health HTTP response code: $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::Health returned ${HTTP_CODE:-no response}, expected 200."
              exit 1
            fi

            if ! grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/health.json; then
              echo "::error::HTTP 200 but status is not ok."
              cat /tmp/health.json
              exit 1
            fi

            # Read the reported revision without a multi-line inline script:
            # YAML block scalars and shell quoting around embedded Python are
            # a reliable source of broken workflows.
            CURRENT=$(sed -n 's/.*"revision"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
              /tmp/health.json | head -1)
            CURRENT=${CURRENT:-}

            if [ "$CURRENT" = "$EXPECTED_REVISION" ]; then
              echo "Healthy and current."
              cat /tmp/health.json
              exit 0
            fi

            # Anything that is not a full git SHA cannot be trusted as a build
            # identity. "unknown", "dev" and a hand-written label all fail here,
            # which is what stops an old build being reported as current.
            if ! printf '%s' "$CURRENT" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::Reported revision '${CURRENT}' is missing or not a"
              echo "::error::trustworthy build identity. Production must report the"
              echo "::error::real commit the platform built; a supplied label is not"
              echo "::error::evidence. Refusing to call this deployment current."
              echo "::error::Operator action required: the deployed build does not"
              echo "::error::identify its own commit, so it cannot be proven current."
              cat /tmp/health.json
              exit 1
            fi

            echo "Healthy but serving revision ${CURRENT}, expected ${EXPECTED_REVISION}."
            cat /tmp/health.json

            if [ "$i" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::Timed out waiting for the expected build to go live."
              exit 1
            fi

            echo "Waiting ${DELAY}s before retry..."
            sleep "$DELAY"
          done

      - name: Validate public endpoints
        run: |
          set -euo pipefail

          # These are unauthenticated by design, so they prove availability and
          # nothing about credentials. They are kept as liveness checks and are
          # deliberately NOT used as evidence that any secret works.
          HTTP_CODE=$(curl -s -o /tmp/public_check.json -w "%{http_code}" \
            --connect-timeout 10 \
            --max-time 20 \
            -H "Cache-Control: no-cache" \
            -H "X-Cache-Bypass: 1" \
            "$SCHOLARZONE_API_URL/scholarships/stats" || true)
          echo "Public endpoint /scholarships/stats HTTP response code: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Public endpoint /scholarships/stats returned HTTP $HTTP_CODE."
            cat /tmp/public_check.json 2>/dev/null || echo "  (no response body)"
            exit 1
          fi

          echo "Public endpoints are healthy."

      - name: Upload health check artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-deploy-health-logs
          path: |
            /tmp/health.json
            /tmp/public_check.json

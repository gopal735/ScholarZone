name: ScholarZone Deploy

on:
  workflow_run:
    workflows: [ScholarZone CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run preflight
        run: |
          cd backend
          python scripts/preflight.py 2>&1 | tee preflight.log
        env:
          SCHOLARZONE_ENVIRONMENT: test

      - name: Upload preflight logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deploy-preflight-logs
          path: backend/preflight.log

  deploy:
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Trigger deployment
        run: |
          # Trigger deploy via Render API (legacy) or SnapDeploy API
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            echo "Using Render API to trigger deployment..."
            HTTP_CODE=$(curl -s -o /tmp/deploy_response.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")
            echo "Render deploy HTTP response code: $HTTP_CODE"
            cat /tmp/deploy_response.json

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
              echo "Render deployment triggered successfully."
            else
              echo "::warning::Render deployment failed (HTTP $HTTP_CODE). Will try SnapDeploy..."
            fi
          fi

          if [ -n "$SNAPDEPLOY_API_KEY" ]; then
            echo "Using SnapDeploy API to trigger deployment..."
            HTTP_CODE=$(curl -s -o /tmp/deploy_response.json -w "%{http_code}" \
              -X POST \
              -H "X-API-Key: $SNAPDEPLOY_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"containerName":"scholarzone-api-2ee2d"}' \
              "https://snapdeploy.dev/api/containers/deploy")
            echo "SnapDeploy deploy HTTP response code: $HTTP_CODE"
            cat /tmp/deploy_response.json

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
              echo "SnapDeploy deployment triggered successfully."
            else
              echo "::error::SnapDeploy deployment trigger failed with HTTP $HTTP_CODE."
              exit 1
            fi
          elif [ ! -f /tmp/deploy_response.json ]; then
            echo "::warning::No deployment API keys found. Container should auto-deploy on push via SnapDeploy GitHub integration."
          fi
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          SNAPDEPLOY_API_KEY: ${{ secrets.SNAPDEPLOY_API_KEY }}

      - name: Upload deploy response
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-response
          path: /tmp/deploy_response.json

  post-deploy-health:
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production
    env:
      SCHOLARZONE_API_URL: ${{ secrets.SCHOLARZONE_API_URL }}
      SCHOLARZONE_VERIFICATION_SECRET: ${{ secrets.SCHOLARZONE_VERIFICATION_SECRET }}
    steps:
      - name: Wait for deployment to become healthy
        run: |
          MAX_ATTEMPTS=30
          DELAY=15
          PRODUCTION_URL="${{ secrets.SCHOLARZONE_API_URL }}"

          if [ -z "$PRODUCTION_URL" ]; then
            echo "::error::SCHOLARZONE_API_URL secret is not set."
            exit 1
          fi

          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "Health check attempt $i of $MAX_ATTEMPTS..."
            HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" \
              --connect-timeout 10 \
              --max-time 20 \
              -X GET \
              "$PRODUCTION_URL/health")
            echo "Health HTTP response code: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health endpoint is ready."
              cat /tmp/health.json
              break
            fi

            if [ $i -eq $MAX_ATTEMPTS ]; then
              echo "::error::Health check timed out after $MAX_ATTEMPTS attempts."
              cat /tmp/health.json 2>/dev/null || echo "  (no response body)"
              exit 1
            fi

            echo "Waiting ${DELAY}s before retry..."
            sleep $DELAY
          done

      - name: Validate scholarships stats endpoint
        run: |
          PRODUCTION_URL="${{ secrets.SCHOLARZONE_API_URL }}"
          HTTP_CODE=$(curl -s -o /tmp/stats.json -w "%{http_code}" \
            --connect-timeout 10 \
            --max-time 20 \
            -X GET \
            -H "X-Verification-Secret: $SCHOLARZONE_VERIFICATION_SECRET" \
            "$PRODUCTION_URL/scholarships/stats")
          echo "Scholarships stats HTTP response code: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Scholarships stats endpoint returned HTTP $HTTP_CODE."
            cat /tmp/stats.json 2>/dev/null || echo "  (no response body)"
            exit 1
          fi

          echo "Scholarships stats endpoint is healthy."
          cat /tmp/stats.json

      - name: Validate internal verify status
        run: |
          PRODUCTION_URL="${{ secrets.SCHOLARZONE_API_URL }}"
          HTTP_CODE=$(curl -s -o /tmp/verify_status.json -w "%{http_code}" \
            --connect-timeout 10 \
            --max-time 20 \
            -X GET \
            -H "X-Verification-Secret: $SCHOLARZONE_VERIFICATION_SECRET" \
            "$PRODUCTION_URL/internal/verify/status")
          echo "Internal verify status HTTP response code: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Internal verify status endpoint returned HTTP $HTTP_CODE."
            cat /tmp/verify_status.json 2>/dev/null || echo "  (no response body)"
            exit 1
          fi

          echo "Internal verify status endpoint is healthy."
          cat /tmp/verify_status.json

      - name: Upload health check artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-deploy-health-logs
          path: |
            /tmp/health.json
            /tmp/stats.json
            /tmp/verify_status.json
name: ScholarZone Native GitHub Deployment Verification

on:
  workflow_run:
    workflows: [ScholarZone CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  actions: read

concurrency:
  group: production-deployment-verification
  cancel-in-progress: true

jobs:
  verify-native-github-deployment:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production
    env:
      SCHOLARZONE_API_URL: ${{ vars.SCHOLARZONE_API_URL }}
      SCHOLARZONE_VERIFICATION_SECRET: ${{ secrets.SCHOLARZONE_VERIFICATION_SECRET }}
    steps:
      - name: Validate production configuration
        run: |
          set -euo pipefail

          if [ -z "$SCHOLARZONE_API_URL" ]; then
            echo "::error::SCHOLARZONE_API_URL repository variable is not set."
            exit 1
          fi

          if [ -z "$SCHOLARZONE_VERIFICATION_SECRET" ]; then
            echo "::error::SCHOLARZONE_VERIFICATION_SECRET repository secret is not set."
            exit 1
          fi

          echo "Verifying the deployed API at the configured SCHOLARZONE_API_URL."
          echo "This check is host-agnostic: it proves the running build matches"
          echo "this commit regardless of which platform serves it."

      - name: Wait for deployment to become healthy AND current
        env:
          # The commit this workflow is verifying. A deployment that is healthy
          # but serving an older build is a failed deployment, not a success.
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail

          MAX_ATTEMPTS=40
          DELAY=15
          EXPECTED_SHORT="${EXPECTED_REVISION:0:12}"
          CURRENT=""

          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Health check attempt $i of $MAX_ATTEMPTS (expecting revision ${EXPECTED_SHORT})..."
            HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" \
              --connect-timeout 10 \
              --max-time 20 \
              -H "Cache-Control: no-cache" \
              -H "X-Cache-Bypass: 1" \
              "$SCHOLARZONE_API_URL/health" || true)
            echo "Health HTTP response code: $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::Health returned ${HTTP_CODE:-no response}, expected 200."
              exit 1
            fi

            if ! grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/health.json; then
              echo "::error::HTTP 200 but status is not ok."
              cat /tmp/health.json
              exit 1
            fi

            # Read the reported revision without a multi-line inline script:
            # YAML block scalars and shell quoting around embedded Python are
            # a reliable source of broken workflows.
            CURRENT=$(sed -n 's/.*"revision"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
              /tmp/health.json | head -1)
            CURRENT=${CURRENT:-}

            if [ "$CURRENT" = "$EXPECTED_SHORT" ]; then
              echo "Healthy and current."
              cat /tmp/health.json
              exit 0
            fi

            # Anything that is not a full git SHA cannot be trusted as a build
            # identity. "unknown", "dev" and a hand-written label all fail here,
            # which is what stops an old build being reported as current.
            if ! printf '%s' "$CURRENT" | grep -Eq '^[0-9a-f]{7,40}$'; then
              echo "::error::Reported revision '${CURRENT}' is missing or not a"
              echo "::error::trustworthy build identity. Production must report the"
              echo "::error::real commit the platform built; a supplied label is not"
              echo "::error::evidence. Refusing to call this deployment current."
              echo "::error::Operator action required: the deployed build does not"
              echo "::error::identify its own commit, so it cannot be proven current."
              cat /tmp/health.json
              exit 1
            fi

            echo "Healthy but serving revision ${CURRENT}, expected ${EXPECTED_SHORT}."
            cat /tmp/health.json

            if [ "$i" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::Timed out waiting for the expected build to go live."
              exit 1
            fi

            echo "Waiting ${DELAY}s before retry..."
            sleep "$DELAY"
          done

      - name: Validate the verification secret against the guarded endpoint
        run: |
          set -euo pipefail

          # This is the step that proves the credential actually works.
          #
          # The two checks this replaces both sent X-Verification-Secret to
          # endpoints that never read the header, so they returned 200 no matter
          # what the secret contained. A rotated, mismatched or emptied secret
          # therefore passed this gate silently. The endpoint used here is
          # genuinely guarded and answers 401 to a wrong secret, so a bad
          # credential now fails the deployment instead of being certified.
          HTTP_CODE=$(curl -s -o /tmp/auth_check.json -w "%{http_code}" \
            --connect-timeout 10 \
            --max-time 20 \
            -H "Cache-Control: no-cache" \
            -H "X-Cache-Bypass: 1" \
            -H "X-Verification-Secret: $SCHOLARZONE_VERIFICATION_SECRET" \
            "$SCHOLARZONE_API_URL/internal/auth-check" || true)
          echo "Guarded auth-check HTTP response code: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::The deployed API rejected the configured verification secret (HTTP $HTTP_CODE)."
            echo "::error::The deployment and the repository secret disagree. The secret was not rotated;"
            echo "::error::the two stores hold different values, or the new value has not been deployed yet."
            cat /tmp/auth_check.json 2>/dev/null || echo "  (no response body)"
            exit 1
          fi

          # The response is a fixed literal. Nothing secret is echoed, and the
          # header itself is never printed, so this log stays safe to keep.
          echo "Verification secret accepted by the guarded endpoint."
          cat /tmp/auth_check.json
          echo

      - name: Validate public endpoints
        run: |
          set -euo pipefail

          # These are unauthenticated by design, so they prove availability and
          # nothing about credentials. They are kept as liveness checks and are
          # deliberately NOT used as evidence that the secret works.
          for path in /scholarships/stats /internal/verify/status; do
            HTTP_CODE=$(curl -s -o /tmp/public_check.json -w "%{http_code}" \
              --connect-timeout 10 \
              --max-time 20 \
              -H "Cache-Control: no-cache" \
              -H "X-Cache-Bypass: 1" \
              "$SCHOLARZONE_API_URL$path" || true)
            echo "Public endpoint $path HTTP response code: $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::Public endpoint $path returned HTTP $HTTP_CODE."
              cat /tmp/public_check.json 2>/dev/null || echo "  (no response body)"
              exit 1
            fi
          done

          echo "Public endpoints are healthy."

      - name: Upload health check artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-deploy-health-logs
          path: |
            /tmp/health.json
            /tmp/auth_check.json
            /tmp/public_check.json

name: ScholarZone Native GitHub Deployment Verification

on:
  workflow_run:
    workflows: [ScholarZone CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  actions: read

concurrency:
  group: production-deployment-verification
  cancel-in-progress: true

jobs:
  verify-native-github-deployment:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production
    env:
      SCHOLARZONE_API_URL: ${{ vars.SCHOLARZONE_API_URL }}
      SCHOLARZONE_VERIFICATION_SECRET: ${{ secrets.SCHOLARZONE_VERIFICATION_SECRET }}
    steps:
      - name: Validate production configuration
        run: |
          set -euo pipefail

          if [ -z "$SCHOLARZONE_API_URL" ]; then
            echo "::error::SCHOLARZONE_API_URL repository variable is not set."
            exit 1
          fi

          if [ -z "$SCHOLARZONE_VERIFICATION_SECRET" ]; then
            echo "::error::SCHOLARZONE_VERIFICATION_SECRET repository secret is not set."
            exit 1
          fi

          echo "SnapDeploy GitHub integration owns production deployment; this workflow verifies the deployed container."

      - name: Wait for SnapDeploy deployment to become healthy
        run: |
          set -euo pipefail

          MAX_ATTEMPTS=40
          DELAY=15

          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Health check attempt $i of $MAX_ATTEMPTS..."
            HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" \
              --connect-timeout 10 \
              --max-time 20 \
              -H "Cache-Control: no-cache" \
              -H "X-Cache-Bypass: 1" \
              "$SCHOLARZONE_API_URL/health" || true)
            echo "Health HTTP response code: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ] && grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/health.json; then
              echo "Health endpoint is ready."
              cat /tmp/health.json
              break
            fi

            if [ "$i" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::Health check timed out after $MAX_ATTEMPTS attempts."
              cat /tmp/health.json 2>/dev/null || echo "  (no response body)"
              exit 1
            fi

            echo "Waiting ${DELAY}s before retry..."
            sleep "$DELAY"
          done

      - name: Validate scholarships stats endpoint
        run: |
          set -euo pipefail

          HTTP_CODE=$(curl -s -o /tmp/stats.json -w "%{http_code}" \
            --connect-timeout 10 \
            --max-time 20 \
            -H "Cache-Control: no-cache" \
            -H "X-Cache-Bypass: 1" \
            -H "X-Verification-Secret: $SCHOLARZONE_VERIFICATION_SECRET" \
            "$SCHOLARZONE_API_URL/scholarships/stats" || true)
          echo "Scholarships stats HTTP response code: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Scholarships stats endpoint returned HTTP $HTTP_CODE."
            cat /tmp/stats.json 2>/dev/null || echo "  (no response body)"
            exit 1
          fi

          echo "Scholarships stats endpoint is healthy."
          cat /tmp/stats.json

      - name: Validate internal verify status
        run: |
          set -euo pipefail

          HTTP_CODE=$(curl -s -o /tmp/verify_status.json -w "%{http_code}" \
            --connect-timeout 10 \
            --max-time 20 \
            -H "Cache-Control: no-cache" \
            -H "X-Cache-Bypass: 1" \
            -H "X-Verification-Secret: $SCHOLARZONE_VERIFICATION_SECRET" \
            "$SCHOLARZONE_API_URL/internal/verify/status" || true)
          echo "Internal verify status HTTP response code: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Internal verify status endpoint returned HTTP $HTTP_CODE."
            cat /tmp/verify_status.json 2>/dev/null || echo "  (no response body)"
            exit 1
          fi

          echo "Internal verify status endpoint is healthy."
          cat /tmp/verify_status.json

      - name: Upload health check artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-deploy-health-logs
          path: |
            /tmp/health.json
            /tmp/stats.json
            /tmp/verify_status.json

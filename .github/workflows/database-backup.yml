name: Database Backup (encrypted)

# The missing capability, not a report about it.
#
# Until this workflow existed nothing produced a database backup. The recovery
# module recorded that fact, and the release gate held hard-delete because of
# it. This workflow is the response: it produces an encrypted, verified,
# self-describing backup that can be restored, and it fails closed when the
# things it needs are absent.
#
# Three properties are load-bearing:
#
# 1. **It refuses rather than degrading.** No source URL, no passphrase, no
#    encryption binary, no hostname allow-list, a source that is not on that
#    allow-list, or a source that is a known production endpoint each stop the
#    run before anything is dumped. A backup that could not be encrypted must
#    not be written at all - the alternative is a plaintext database in the
#    artifacts of a public repository.
#
# 2. **The plaintext never leaves the runner unencrypted.** The dump is written
#    to a temp directory, encrypted, round-trip verified (decrypted and compared
#    with the original), and only then is the plaintext deleted. The artifact is
#    ciphertext plus a manifest.
#
# 3. **It does not compete with the application for the free-tier budget.** A
#    schedule that dumps often enough to exhaust the network allowance would
#    take the site down to save the database. The schedule is weekly and the
#    script projects the monthly transfer before writing anything, failing the
#    run if it exceeds the budget. That budget is configuration - a repository
#    variable - and there is deliberately no dispatch input for it: the one
#    check standing between a backup and the free-tier allowance is not a thing
#    a caller who can press the button gets to change per run.

on:
  workflow_dispatch:
    inputs:
      runs_per_month:
        description: "Runs per month, for the transfer estimate only"
        required: false
        default: "4"
      # There is no transfer-budget input. It used to live here, which meant
      # anyone with dispatch rights could raise it to a number large enough to
      # switch the check off for a run. The budget is now a repository variable
      # (`vars.SZ_BACKUP_MAX_MONTHLY_MIB`), changeable only by someone with
      # write access and visible in the repository's settings rather than in a
      # per-run form.

  schedule:
    # Weekly on Sunday at 03:00 UTC. Chosen so the projected transfer stays a
    # small fraction of a free-tier allowance: 4 runs per month doubled for
    # upload and download is what the default 512 MiB budget assumes.
    - cron: "0 3 * * 0"

# A backup is authorised by a human pressing the button, never by any code path
# that could run unattended against production.
permissions:
  contents: read

concurrency:
  # Never two backups at once: a second dump would double the transfer cost and
  # could interleave with the first on the same artifact path.
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Fail closed when the backup secret is absent
        id: secrets
        env:
          SZ_BACKUP_PASSPHRASE: ${{ secrets.SZ_BACKUP_PASSPHRASE }}
          SZ_BACKUP_SOURCE_URL: ${{ secrets.SZ_BACKUP_SOURCE_URL }}
          SZ_BACKUP_ALLOWED_HOSTS: ${{ vars.SZ_BACKUP_ALLOWED_HOSTS }}
        run: |
          # Absence is reported as a skip, not a failure. A repository that has
          # not been given a passphrase has not been given permission to make
          # a backup, and failing the workflow would make the missing secret
          # look like a broken build rather than an unconsumed capability.
          #
          # The allow-list is treated the same way: with no hosts named, there
          # is nothing the script is allowed to read, so the run stops rather
          # than proceeding with a guard that has nothing to compare against.
          # The script refuses on its own too - this only names the reason.
          missing=()
          [ -n "$SZ_BACKUP_PASSPHRASE" ] || missing+=("SZ_BACKUP_PASSPHRASE")
          [ -n "$SZ_BACKUP_SOURCE_URL" ] || missing+=("SZ_BACKUP_SOURCE_URL")
          [ -n "$SZ_BACKUP_ALLOWED_HOSTS" ] || missing+=("SZ_BACKUP_ALLOWED_HOSTS")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Backup not run. Required configuration is absent: ${missing[*]}"
            echo "Adding these enables it:"
            echo "  SZ_BACKUP_PASSPHRASE    - the encryption passphrase, stored nowhere else"
            echo "  SZ_BACKUP_SOURCE_URL    - the source connection string. A PRODUCTION"
            echo "                           source is refused on this schedule"
            echo "                           whatever the configuration says; it is"
            echo "                           permitted only on a manual dispatch with"
            echo "                           SZ_BACKUP_PRODUCTION_AUTHORIZATION recorded."
            echo "  SZ_BACKUP_ALLOWED_HOSTS - comma-separated hostnames the backup"
            echo "                           may read. Default-deny: a source host"
            echo "                           that is not named there is refused."
            echo "  SZ_BACKUP_RESTORE_URI   - optional non-production empty target the"
            echo "                           backup is restored into, so the manifest"
            echo "                           can say restore_verified: true."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Produce the encrypted backup
        if: steps.secrets.outputs.skipped != 'true'
        env:
          SZ_BACKUP_PASSPHRASE: ${{ secrets.SZ_BACKUP_PASSPHRASE }}
          SZ_BACKUP_SOURCE_URL: ${{ secrets.SZ_BACKUP_SOURCE_URL }}
          SZ_BACKUP_ALLOWED_HOSTS: ${{ vars.SZ_BACKUP_ALLOWED_HOSTS }}
          # The non-production database a backup is restored into to prove it.
          # A repository variable, never a secret: it names a host. When it is
          # unset the run is reported below as "restore verification not
          # configured" rather than as a verified backup.
          SZ_BACKUP_RESTORE_URI: ${{ vars.SZ_BACKUP_RESTORE_URI }}
          # Set by the repository owner to record that a PRODUCTION source is
          # authorised (who approved it and when). Absent means a production
          # host cannot be backed up at all - the path exists for the owner to
          # use deliberately, not for a schedule to discover.
          SZ_BACKUP_PRODUCTION_AUTHORIZATION: ${{ vars.SZ_BACKUP_PRODUCTION_AUTHORIZATION }}
          # Optional, and a repository variable rather than a dispatch input:
          # absent leaves the built-in 512 MiB default in place. A malformed,
          # empty, non-positive, or absurd value refuses the run rather than
          # being silently ignored, so a typo cannot quietly disable the
          # transfer budget.
          SZ_BACKUP_MAX_MONTHLY_MIB: ${{ vars.SZ_BACKUP_MAX_MONTHLY_MIB }}
        run: |
          cd backend
          # The output directory must exist before `tee` opens a file inside
          # it. `tee ../backup-out/result.json` fails on a clean runner with
          # "no such file or directory" - because the script's
          # output_dir.mkdir() has not run yet, and the run reports a
          # pipeline failure that looks like a backup failure. Creating it
          # here, with the same name the script would have used, makes the
          # clean-runner path deterministic: `mkdir -p` is a no-op when the
          # directory already exists, so a re-run behaves identically.
          mkdir -p ../backup-out
          # The authorization mode comes from WHAT TRIGGERED THIS RUN, not from
          # a string anybody can set: workflow_dispatch is a person, schedule is
          # not. Under the scheduled policy a production source is refused
          # whatever the allow-list and the authorization say, so the weekly
          # job cannot silently become the production backup the policy
          # reserves for a human.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            auth_mode=manual
          else
            auth_mode=scheduled
          fi
          verify_args=()
          if [ -n "${SZ_BACKUP_RESTORE_URI:-}" ]; then
            # The restore target is configured, so the backup is proven this
            # run and the manifest says so. With no target configured the run
            # still produces a decryptable artifact, but its manifest records
            # restore_verified: false - a state that must not satisfy a
            # migration or deletion gate.
            verify_args+=(--verify-restore-into "$SZ_BACKUP_RESTORE_URI")
          fi
          python scripts/pg_backup.py \
            --source-url-env SZ_BACKUP_SOURCE_URL \
            --passphrase-env SZ_BACKUP_PASSPHRASE \
            --authorization-mode "$auth_mode" \
            --output-dir ../backup-out \
            "${verify_args[@]}" \
            --runs-per-month "${{ github.event.inputs.runs_per_month || '4' }}" \
            | tee ../backup-out/result.json

      - name: Upload the ciphertext and its manifest
        if: steps.secrets.outputs.skipped != 'true'
        uses: actions/upload-artifact@v4
        with:
          # Only these two files. The plaintext dump is deleted before this
          # step runs, so there is nothing else for the glob to catch.
          name: database-backup-${{ github.run_id }}
          path: |
            backup-out/*.szbak
            backup-out/*.manifest.json
          # Deliberately short. An artifact that outlives its usefulness is an
          # encrypted copy of production data sitting in a public listing.
          retention-days: 14
          if-no-files-found: error

      - name: Verify the artifact is not plaintext
        if: steps.secrets.outputs.skipped != 'true'
        run: |
          # A final, independent check on what is about to be published. The
          # script already refuses to write an unencrypted backup, but this
          # asserts it on the file itself, so a future change that removed the
          # refusal would be caught here rather than by whoever downloads it.
          set -euo pipefail
          shopt -s nullglob
          files=(backup-out/*.szbak)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No .szbak artifact was produced"
            exit 1
          fi
          for f in "${files[@]}"; do
            # The format's first line is a marker that is only present in the
            # encrypted form. An unencrypted dump starts with PostgreSQL's own
            # header or SQL, so a mismatch here means something is wrong.
            first_line="$(head -c 32 "$f" | head -1 || true)"
            case "$first_line" in
              SzBackup/v1*) echo "OK   $f is encrypted (header: $first_line)" ;;
              *) echo "::error::$f is NOT in the encrypted backup format: $first_line"; exit 1 ;;
            esac
            # A plaintext dump contains SQL or PostgreSQL's binary signature.
            if grep -qE '^(CREATE TABLE|INSERT INTO|--)' "$f" 2>/dev/null; then
              echo "::error::$f appears to contain plaintext SQL"
              exit 1
            fi
          done
          echo "All artifacts are encrypted."

      - name: Report the backup identity
        if: steps.secrets.outputs.skipped != 'true'
        run: |
          echo "### Database backup" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for f in backup-out/*.manifest.json; do
            python - "$f" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          rows = [
               ("Created (UTC)", data["created_at"]),
               ("Source", data["source_identity"]),
               # Which hosts the allow-list permitted when this ran, so the
               # artifact can be audited against the configuration that
               # authorised it. Not the URL: the source identity above is scheme
               # and host only.
               ("Allow-list permitted", ", ".join(data["allowed_hosts"] or []) or "none"),
               # What class of database this came from, by host policy rather
               # than by a substring in its name, and the authorization that
               # admitted a production source (None for non-production).
               ("Source class", data.get("source_kind", "non-production")),
               ("Production authorization", data.get("production_authorization") or "n/a (non-production)"),
               ("Round-trip verified", data["round_trip_verified"]),
               # The claim that matters in an incident: restored, or merely
               # decryptable. A False here is a backup nobody has proven.
               ("Restored and verified", data.get("restore_verified", False)),
               ("Ciphertext size", f"{data['ciphertext_bytes']:,} bytes"),
               ("Plaintext size", f"{data['plaintext_bytes']:,} bytes"),
               ("Ciphertext SHA-256", f"`{data['ciphertext_sha256']}`"),
               ("Encryption", data["backend"]),
               ("Projected monthly transfer", f"{data['projected_monthly_transfer_mib']} MiB (projection, not measured usage)"),
               ("Transfer budget", f"{data['transfer_budget_mib']} MiB"),
           ]
          for label, value in rows:
              print(f"| {label} | {value} |")
          PY
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The plaintext dump was deleted on the runner after encryption and" >> "$GITHUB_STEP_SUMMARY"
          echo "verification. Only the ciphertext is retained, and the passphrase" >> "$GITHUB_STEP_SUMMARY"
          echo "lives only in the repository secret." >> "$GITHUB_STEP_SUMMARY"

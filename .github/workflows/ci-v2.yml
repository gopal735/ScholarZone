name: ScholarZone CI v2
'on':
  pull_request:
    branches:
    - main
    - master
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      SCHOLARZONE_ENVIRONMENT: test
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libtiff5-dev libwebp-dev
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-v2-${{ hashFiles('backend/requirements.txt') }}
        restore-keys:
        - ${{ runner.os }}-pip-v2-
    - name: Install dependencies
      run: cd backend && pip install -r requirements.txt
    - name: Debug - verify pip install
      run: cd backend && pip list | grep -E "(fastapi|pydantic|sqlalchemy|psycopg|httpx|pillow|beautifulsoup4|apscheduler|resend|python-dotenv)" || true
    - name: Debug - test critical imports
      run: bash scripts/debug_imports.sh
    - name: Debug - verify environment
      run: 'cd backend && python -c "import sys; print(f''Python: {sys.version}''); import app; print(''app import ok''); import pytest; print(''pytest ok'')" 2>&1

        '
    - name: Debug - run simple test
      run: cd backend && python -m pytest tests/test_git_integrity_regression.py -v --tb=short 2>&1
    - name: Run backend tests
      run: cd backend && set -o pipefail && python -m pytest tests/ --tb=short 2>&1 | tee pytest.log
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: backend-tests-logs
        path: backend/pytest.log

name: ScholarZone scheduled maintenance

# Runs the maintenance worker in-process against Neon.
#
# This workflow previously woke the SnapDeploy container and called the
# production API over HTTP. SnapDeploy Free containers sleep, and the wake is
# not guaranteed, so a scheduled verification run depended on a platform
# behaviour it does not control - and verification is precisely the job that
# matters most when nobody is watching.
#
# The worker imports the same service layer the API uses and connects straight
# to the database, so a scheduled run and an operator-triggered run cannot
# drift apart. SnapDeploy remains the API runtime for the frontend; it is simply
# not on the maintenance path any more.
#
# Concurrency prevents a long run from overlapping the next scheduled one.

on:
  schedule:
    # Every twelve hours, off the hour so it does not pile onto the top of the
    # hour when every other cron fires.
    - cron: '7 */12 * * *'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to run (verify, enrich, images, discover, or all)'
        required: false
        default: 'all'
      limit:
        description: 'Maximum records per stage'
        required: false
        default: '60'

concurrency:
  group: scholarzone-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run maintenance worker
        working-directory: backend
        env:
          # Secret values are passed as environment variables and are never
          # echoed. `set -x` is deliberately not enabled, and no command
          # interpolates the URL into its output.
          SCHOLARZONE_DATABASE_URL: ${{ secrets.SCHOLARZONE_DATABASE_URL }}
          SCHOLARZONE_VERIFICATION_SECRET: ${{ secrets.SCHOLARZONE_VERIFICATION_SECRET }}
          SCHOLARZONE_ADMIN_SECRET: ${{ secrets.SCHOLARZONE_ADMIN_SECRET }}
          # The setting name is SCHOLARZONE_ENVIRONMENT, not SCHOLARZONE_ENV.
          # With the wrong name the app stays in development mode, and a
          # development-mode database_url falls back to a local SQLite file -
          # which would make this job quietly maintain the wrong database
          # instead of Neon.
          SCHOLARZONE_ENVIRONMENT: production
          PYTHONPATH: '.'
        run: |
          python -m app.jobs.scholarzone_maintenance \
            --stage "${{ github.event.inputs.stage || 'all' }}" \
            --limit "${{ github.event.inputs.limit || '60' }}" \
            --workers 4

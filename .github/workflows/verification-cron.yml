name: ScholarZone scheduled maintenance

# Runs the maintenance worker in-process against Neon.
#
# This workflow previously woke the SnapDeploy container and called the
# production API over HTTP. SnapDeploy Free containers sleep, and the wake is
# not guaranteed, so a scheduled verification run depended on a platform
# behaviour it does not control - and verification is precisely the job that
# matters most when nobody is watching.
#
# The worker imports the same service layer the API uses and connects straight
# to the database, so a scheduled run and an operator-triggered run cannot
# drift apart. This workflow has no dependency on any web runtime: not the
# public API, not an admin route, and not the frontend host. If the web tier is
# down, being deployed, or has moved provider, maintenance is unaffected.
#
# Platform limits, stated honestly: GitHub-hosted scheduled workflows can be
# delayed by platform load, and on a public repository they can be disabled
# after a long period of repository inactivity. Neither is something this file
# can work around. The worker is idempotent and cursor-driven precisely so that
# a delayed, skipped, cancelled or repeated run leaves the catalogue in a
# consistent state and simply continues from where it stopped.
#
# Concurrency prevents a long run from overlapping the next scheduled one.

on:
  schedule:
    # Every twelve hours, off the hour so it does not pile onto the top of the
    # hour when every other cron fires.
    - cron: '7 */12 * * *'
  workflow_dispatch:
    inputs:
      slot_id:
        # Kept on one line deliberately: a multi-line single-quoted YAML scalar is
        # an unterminated string to Python's tokenizer, which makes the
        # SnapDeploy-dependency check fall back to reading the whole file and then
        # flag the historical mention in the comment at the top of this workflow.
        description: 'Durable logical slot this run belongs to, supplied by the external dispatcher. Empty for the normal GitHub schedule.'
        required: false
        type: string
      dispatch_id:
        description: 'Correlation id for an external dispatch.'
        required: false
        type: string
      logical_source:
        description: 'Logical origin of this run. Empty for the normal schedule, which is recorded as github_schedule. The external dispatcher passes external_scheduler_dispatch explicitly, because a GitHub workflow_dispatch event does NOT imply a manual or scheduled origin.'
        required: false
        type: string
      transport_event:
        description: 'What carried the request (schedule, workflow_dispatch). Recorded separately from logical_source.'
        required: false
        type: string
      stage:
        description: 'Stage to run (verify, enrich, images, discover, quarantine, stats, or all)'
        required: false
        default: 'all'
      limit:
        description: 'Maximum records per stage'
        required: false
        default: '60'
      dry_run:
        description: 'Plan only, write nothing'
        required: false
        default: 'false'
      crawl_depth:
        description: 'Discovery crawl depth below each seed URL (0 = seed only, 2 = deep, 4 = very deep)'
        required: false
        default: '0'
      crawl_pages_per_seed:
        description: 'Maximum pages visited per discovery seed, including the seed'
        required: false
        default: '12'
      crawl_max_pages:
        description: 'Batch-wide ceiling on crawled pages, so one portal cannot starve the rest'
        required: false
        default: '600'
      quarantine_ids:
        description: 'Comma-separated ids to assess and quarantine now, then exit'
        required: false
        default: ''
      logo_only:
        description: 'images stage: persist only official identity marks, never programme photos'
        required: false
        default: 'false'
      image_budget_seconds:
        description: 'Per-record wall clock for image discovery. Lower it for a fast catalogue sweep so blocked hosts fail quickly instead of consuming the full budget on every record.'
        required: false
        default: ''
      workers:
        description: 'Bounded concurrency per stage. The images stage is network-bound and rate-limits per domain, so cross-domain parallelism is safe and much faster.'
        required: false
        default: '4'

# Least privilege: the worker only needs to read the repository. It never
# writes to the repository, never uses the GitHub API, and never needs a
# deploy key or package write token.
permissions:
  contents: read

concurrency:
  group: scholarzone-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    # Standard GitHub-hosted runner. A larger runner would reduce wall-clock
    # time but costs money, and this job is deliberately sized to fit the free
    # tier instead.
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Must match the backend runtime used by ci.yml and by the deployed
          # API. Drift here means maintenance can succeed against behaviour the
          # production API does not have.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run maintenance worker
        working-directory: backend
        env:
          # The worker reads no secrets. It is not calling an authenticated
          # HTTP endpoint, so the verification and admin secrets that the old
          # API-based design required are deliberately not passed here: they
          # are consumed only by the header guards in app/routers, and this
          # process imports no router.
          #
          # Secret values are passed as environment variables and are never
          # echoed. `set -x` is deliberately not enabled, and no command
          # interpolates the URL into its output.
          SCHOLARZONE_DATABASE_URL: ${{ secrets.SCHOLARZONE_DATABASE_URL }}
          # The setting name is SCHOLARZONE_ENVIRONMENT, not SCHOLARZONE_ENV.
          # With the wrong name the app stays in development mode, and a
          # development-mode database_url falls back to a local SQLite file -
          # which would make this job quietly maintain the wrong database
          # instead of Neon. The worker refuses to start if production mode
          # does not resolve to a PostgreSQL URL.
          SCHOLARZONE_ENVIRONMENT: production
          PYTHONPATH: '.'
        run: |
          # Output is tee'd to a file as well as the console. Several real
          # failures produced no log lines at all, so the step's reason for
          # failing was only visible by attaching the artifact - which is a
          # poor way to run a production maintenance job.
          set -o pipefail
          python -m app.jobs.scholarzone_maintenance \
            --stage "${{ github.event.inputs.stage || 'all' }}" \
            --limit "${{ github.event.inputs.limit || '60' }}" \
            --workers "${{ github.event.inputs.workers || '4' }}" \
            --crawl-depth "${{ github.event.inputs.crawl_depth || '0' }}" \
            --crawl-pages-per-seed "${{ github.event.inputs.crawl_pages_per_seed || '12' }}" \
            --crawl-max-pages "${{ github.event.inputs.crawl_max_pages || '600' }}" \
            --quarantine-ids "${{ github.event.inputs.quarantine_ids || '' }}" \
            ${{ github.event.inputs.logo_only == 'true' && '--logo-only' || '' }} \
            --image-budget-seconds "${{ github.event.inputs.image_budget_seconds || '90' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            2>&1 | tee "$RUNNER_TEMP/worker.log"
          status=${PIPESTATUS[0]}
          echo "$status" > "$RUNNER_TEMP/worker.status"
          exit "$status"

      - name: Upload worker log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-log
          path: |
            ${{ runner.temp }}/worker.log
            ${{ runner.temp }}/worker.status
          if-no-files-found: ignore
          retention-days: 7

      # purge_closed is the only stage that deletes rows. Its snapshot is the only
      # thing standing between a bad selection and an unrecoverable catalogue,
      # so it is uploaded whether or not the run passed - a deleted row nobody
      # saved is exactly the case where the evidence matters most.
      - name: Upload deleted-record snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purged-records-snapshot
          path: |
            backend/config/purged_records_archive.json
          if-no-files-found: ignore
          retention-days: 90

      # The worklist stage writes its backlog here. It is far too large for the
      # run log, and a stage that tries to print it loses its own output.
      - name: Upload research worklist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pending-research-worklist
          path: |
            backend/.worklist/pending_research.json
            backend/.worklist/field_inventory.json
          if-no-files-found: ignore
          retention-days: 3

  # Bounded retry for transient failures.
  #
  # The concurrency group above is authoritative: at most one maintenance run
  # exists at a time, so this can never overlap the next scheduled run or a
  # manual dispatch. A retry is a fresh process against a durable cursor, so it
  # resumes rather than redoing, and every attempt writes its own MaintenanceRun
  # row - a retried run leaves several honest records rather than one
  # overwritten one.
  #
  # There is no internal retry loop: the worker never re-runs a stage, so this
  # cannot become an unbounded cycle. Two attempts is enough to ride out a Neon
  # connection reset or a transient network failure without spending runner
  # minutes on a genuine fault.
  #
  # Note on classification: GitHub Actions cannot branch on log text, so this
  # job retries on *any* non-zero exit, including fatal ones such as a missing
  # secret. The worker prints a "failure classification" block
  # (transient / fatal / unknown) so a human can tell instantly whether waiting
  # would have helped. Wiring the retry to only transient classes would require
  # a non-zero exit code reserved for them, which is deliberately not done
  # here: the exit code contract from the previous phase is preserved as-is.
  retry:
    timeout-minutes: 90
    needs: maintain
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: scholarzone-maintenance
      cancel-in-progress: false
    steps:
      - name: Explain retry
        run: |
          echo "The maintenance run failed. Retrying once."
          echo ""
          echo "If the previous run's log shows 'classification: fatal' - for"
          echo "example a missing secret, a failed import, or a schema error -"
          echo "this retry will fail identically. Check the repository secret"
          echo "and the application version before running again manually."

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retry maintenance worker
        working-directory: backend
        env:
          SCHOLARZONE_DATABASE_URL: ${{ secrets.SCHOLARZONE_DATABASE_URL }}
          SCHOLARZONE_ENVIRONMENT: production
          PYTHONPATH: '.'
          # Marks the attempt so the MaintenanceRun record says which one this is.
          SZ_RETRY_ATTEMPT: '2'
        run: |
          python -m app.jobs.scholarzone_maintenance \
            --stage "${{ github.event.inputs.stage || 'all' }}" \
            --limit "${{ github.event.inputs.limit || '60' }}" \
            --workers "${{ github.event.inputs.workers || '4' }}" \
            --crawl-depth "${{ github.event.inputs.crawl_depth || '0' }}" \
            --crawl-pages-per-seed "${{ github.event.inputs.crawl_pages_per_seed || '12' }}" \
            --crawl-max-pages "${{ github.event.inputs.crawl_max_pages || '600' }}" \
            --quarantine-ids "${{ github.event.inputs.quarantine_ids || '' }}" \
            ${{ github.event.inputs.logo_only == 'true' && '--logo-only' || '' }} \
            --image-budget-seconds "${{ github.event.inputs.image_budget_seconds || '90' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

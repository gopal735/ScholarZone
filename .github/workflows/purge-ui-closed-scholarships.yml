name: Purge UI-closed scholarships

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PURGE ALL UI-CLOSED SCHOLARSHIPS + LINKED DATA to hard-delete the current UI-closed set"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-ui-closed-scholarship-purge
  cancel-in-progress: false

jobs:
  purge:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SCHOLARZONE_ENVIRONMENT: production
      SCHOLARZONE_DATABASE_URL: ${{ secrets.SCHOLARZONE_DATABASE_URL }}
      PURGE_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Require exact destructive confirmation
        run: |
          if [ "$PURGE_CONFIRMATION" != "PURGE ALL UI-CLOSED SCHOLARSHIPS + LINKED DATA" ]; then
            echo "::error::Confirmation text did not match; no database changes were made."
            exit 1
          fi
          if [ -z "$SCHOLARZONE_DATABASE_URL" ]; then
            echo "::error::SCHOLARZONE_DATABASE_URL is not configured."
            exit 1
          fi

      - name: Check out master
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Purge UI-closed scholarships and linked rows
        working-directory: backend
        run: python -m scripts.purge_ui_closed_scholarships --apply --confirm "$PURGE_CONFIRMATION"

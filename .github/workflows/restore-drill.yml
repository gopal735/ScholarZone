name: Restore drill

# Prove the real backup and restore procedure every month, against throwaway
# PostgreSQL databases on the runner.
#
# The drill exercises the CANONICAL pipeline (backend/scripts/pg_backup.py +
# backend/scripts/pg_restore.py, encrypted) - the same scripts the production
# backup workflow runs - and then tries to break it:
#
#   * a backup taken with restore verification (--verify-restore-into);
#   * the same artifact restored independently into a second target by the
#     documented restore command, with row counts reconciled;
#   * pg_restore --list on the decrypted archive;
#   * a gzip-wrapped custom archive is REFUSED (the defect this drill was
#     written after: an outer gzip layer handed to pg_restore);
#   * a corrupted artifact, a wrong passphrase and a non-empty restore target
#     are each refused.
#
# A green run is evidence about the procedure. It is NOT evidence about
# production data or production migration parity: the source is seeded here.

on:
  schedule:
    - cron: "0 4 1 * *" # monthly: 04:00 UTC on the 1st
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    name: backup and restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: drill
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SCHOLARZONE_ENVIRONMENT: test
      SCHOLARZONE_VERIFICATION_SECRET: drill-secret
      PGUSER: drill
      PGPASSWORD: drill
      PGHOST: 127.0.0.1
      PGPORT: "5432"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare the three disposable databases
        run: |
          createdb drill_source
          createdb drill_verify
          createdb drill_restore

      - name: Run the drill (backup, verified restore, second restore, negative cases)
        run: |
          python scripts/restore_drill.py \
            --source "postgresql://drill:drill@127.0.0.1:5432/drill_source" \
            --verify-target "postgresql://drill:drill@127.0.0.1:5432/drill_verify" \
            --restore-target "postgresql://drill:drill@127.0.0.1:5432/drill_restore" \
            --output-dir backups

      - name: Upload the drill summary, manifest and artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill
          path: backups/
          if-no-files-found: warn

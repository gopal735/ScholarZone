name: DB State Check

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase (before/after)'
        required: true
        default: 'before'
      script:
        description: 'Script under backend/scripts to run (read-only)'
        required: false
        default: 'db_state.py'

jobs:
  db-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The audit imports the application's own visibility predicate rather than
      # reimplementing it, which means it needs the app's dependencies and not
      # just a driver. Installing the pinned requirements is the same step the
      # promotion workflow already uses.
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run DB State Query
        run: |
          cd backend
          python "scripts/${{ inputs.script }}"
        env:
          SCHOLARZONE_DATABASE_URL: ${{ secrets.SCHOLARZONE_DATABASE_URL }}
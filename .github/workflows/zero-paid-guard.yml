name: Zero-Paid Dependency Guard

on:
  push:
    branches: [master, fix/deep-scholarship-data-and-card-restoration]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'backend/requirements.txt'
      - '.github/workflows/zero-paid-guard.yml'
  pull_request:
    branches: [master]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'backend/requirements.txt'
      - '.github/workflows/zero-paid-guard.yml'

permissions:
  contents: read

jobs:
  zero-paid-guard:
    name: Zero-Paid Dependency Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for paid-only Node.js dependencies
        run: |
          PAID_PACKAGES=(
            "@vercel/analytics"
            "@vercel/speed-insights"
            "vercel"
            "netlify-cli"
            "@netlify/functions"
            "aws-sdk"
            "@aws-sdk/*"
            "google-cloud"
            "@google-cloud/*"
            "firebase-admin"
            "firebase-functions"
            "stripe"
            "sendgrid"
            "@sendgrid/mail"
            "resend"
            "postmark"
            "mailgun-js"
            "nodemailer"
            "twilio"
            "@twilio/*"
            "algoliasearch"
            "meilisearch"
            "typesense"
            "pinecone-client"
            "weaviate-client"
            "qdrant-client"
            "chromadb"
            "langchain"
            "openai"
            "anthropic"
            "cohere-ai"
            "replicate"
            "huggingface"
            "assemblyai"
            "deepgram"
            "elevenlabs"
            "playwright"
            "puppeteer"
            "chromium"
            "@playwright/test"
            "cypress"
            "sentry"
            "@sentry/*"
            "datadog"
            "newrelic"
            "logrocket"
            "fullstory"
            "amplitude"
            "mixpanel"
            "segment"
            "rudder-sdk-node"
            "posthog-node"
          )

          echo "Checking for paid packages in package.json..."
          if [ ! -f "frontend/package.json" ]; then
            echo "No frontend/package.json found"
            exit 0
          fi

          DEPS=$(cat frontend/package.json | grep -A 1000 '"dependencies"' | head -200)
          DEV_DEPS=$(cat frontend/package.json | grep -A 1000 '"devDependencies"' | head -200)

          FOUND=0
          for pkg in "${PAID_PACKAGES[@]}"; do
            ESCAPED=$(echo "$pkg" | sed 's/[[\.*^$()+?{|\\]/\\&/g')
            if echo "$DEPS" | grep -q "\"$ESCAPED\"" || echo "$DEV_DEPS" | grep -q "\"$ESCAPED\""; then
              echo "WARNING: Found potentially paid package: $pkg"
              FOUND=1
            fi
          done

          if [ $FOUND -eq 1 ]; then
            echo "::warning::Potential paid dependencies detected. Review if they have free tiers that cover our usage."
          else
            echo "No paid packages detected in package.json"
          fi

      - name: Check for paid-only Python dependencies
        run: |
          PAID_PYTHON=(
            "openai"
            "anthropic"
            "cohere"
            "replicate"
            "langchain"
            "langchain-openai"
            "langchain-anthropic"
            "pinecone-client"
            "weaviate-client"
            "qdrant-client"
            "chromadb"
            "milvus"
            "elasticsearch"
            "opensearch-py"
            "algoliasearch"
            "meilisearch"
            "typesense"
            "stripe"
            "sendgrid"
            "postmark"
            "mailgun"
            "twilio"
            "firebase-admin"
            "google-cloud"
            "aws-sdk"
            "boto3"
            "azure"
            "datadog"
            "newrelic"
            "sentry-sdk"
            "loguru"
          )

          echo "Checking for paid Python packages in requirements.txt..."
          if [ ! -f "backend/requirements.txt" ]; then
            echo "No backend/requirements.txt found"
            exit 0
          fi

          FOUND=0
          for pkg in "${PAID_PYTHON[@]}"; do
            if grep -q "^${pkg}[=<>]" backend/requirements.txt || grep -q "^${pkg}$" backend/requirements.txt; then
              echo "WARNING: Found potentially paid Python package: $pkg"
              FOUND=1
            fi
          done

          if [ $FOUND -eq 1 ]; then
            echo "::warning::Potential paid Python dependencies detected. Review if they have free tiers that cover our usage."
          else
            echo "No paid Python packages detected in requirements.txt"
          fi

      - name: Check for database connection strings in frontend
        run: |
          if grep -r "DATABASE_URL\|SCHOLARZONE_DATABASE_URL\|postgresql://\|postgres://\|mysql://\|mongodb://\|redis://\|MONGODB_URI\|REDIS_URL\|NEON_DATABASE_URL\|SUPABASE_URL\|SUPABASE_KEY\|PLANETSCALE_URL\|TURSO_DATABASE_URL" frontend/src --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" 2>/dev/null; then
            echo "::error::Database connection strings found in frontend code"
            exit 1
          else
            echo "No database credentials in frontend"
          fi

      - name: Check for API keys/secrets in frontend
        run: |
          if grep -r "sk_live_\|sk_test_\|pk_live_\|pk_test_\|Bearer \|Authorization: \|api_key\|apikey\|secret\|SECRET_KEY\|PRIVATE_KEY\|ACCESS_TOKEN\|REFRESH_TOKEN" frontend/src --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" 2>/dev/null; then
            echo "::error::Potential API keys/secrets found in frontend code"
            exit 1
          else
            echo "No API keys/secrets in frontend"
          fi

      - name: Check for Static-First Mode
        run: |
          if [ -f "frontend/public/scholarships-snapshot.json" ]; then
            echo "Static snapshot exists - good"
          else
            echo "::warning::Static snapshot not found"
          fi
          if grep -r "staticScholarshipService" frontend/src --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" 2>/dev/null; then
            echo "Static scholarship service used - good"
          else
            echo "::warning::Static scholarship service not found"
          fi

      - name: Validate Public Snapshot
        run: python scripts/validate_snapshot.py

      - name: Display provider limits
        run: cat ZERO_PAID_LIMITS.md
        - paragraph [ref=e88]: Education is the bedrock upon which every nation's growth and development is anchored, particularly in our fast-evolving 21st century global society that requires a multiplicity of skill sets.
        - paragraph [ref=e89]: Our human resource capital is our greatest asset, and we have a duty to capitalize on that for the ultimate benefit of our society.
        - paragraph [ref=e90]: A nation that therefore fails or refuses to invest in the education of its citizens clearly sets itself up for failure. Brains, it is said, develop a nation, not its natural resources, as countries like Japan, Switzerland, Singapore and several other countries have proven over time.

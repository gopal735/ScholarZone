<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Google Search Console site-ownership verification.
         Keep these verification tags in the document head.
         Do not add data-sz-seo to these tags, because page-level SEO
         effects may remove elements carrying that attribute. -->

    <!-- Existing verification token -->
    <meta
      name="google-site-verification"
      content="mzaQ_MW4nVgMwHhbSOxxTsr46gaV7sanks7vbnE7aaE"
    />

    <!-- Existing Netlify property verification token -->
    <meta
      name="google-site-verification"
      content="5ZF6ps7latuMDIU2UQgz68yePIZy2gw_klo_bQbkhds"
    />

    <!-- Vercel Search Console verification token -->
    <meta
      name="google-site-verification"
      content="4TBfdnc-RSZvnCTxOsjYNzQMEYzsUS8G8jHBsZook0k"
    />

    <!-- Main document metadata -->

    <title>ScholarZone · Verified Scholarship Directory</title>

    <meta
      name="description"
      content="Search verified scholarships by country, degree, funding type and deadline. Every listing has been checked against the awarding body's own official page."
      data-sz-seo="true"
    />

    <meta
      name="robots"
      content="index, follow"
      data-sz-seo="true"
    />

    <!-- The canonical public frontend host. robots.txt, sitemap.xml and
         src/services/canonicalOrigin.js all name it, and a crawler receives
         this document before any script runs. It is deliberately not the
         Vercel host: that project serves the API and a mirror of the
         frontend, so naming it here would tell a crawler to consolidate onto
         the mirror. -->
    <link
      rel="canonical"
      href="https://schollarzone.netlify.app/"
      data-sz-seo="true"
    />

    <!-- Open Graph metadata -->

    <meta
      property="og:type"
      content="website"
      data-sz-seo="true"
    />

    <meta
      property="og:site_name"
      content="ScholarZone"
      data-sz-seo="true"
    />

    <meta
      property="og:title"
      content="ScholarZone – Verified Scholarship Directory"
      data-sz-seo="true"
    />

    <meta
      property="og:description"
      content="Search verified scholarships by country, degree, funding type and deadline. Every listing has been checked against the awarding body's own official page."
      data-sz-seo="true"
    />

    <meta
      property="og:url"
      content="https://schollarzone.netlify.app/"
      data-sz-seo="true"
    />

    <meta
      property="og:locale"
      content="en"
      data-sz-seo="true"
    />

    <!-- No social preview image is declared because the project
         does not currently specify a verified social image asset. -->

    <!-- Twitter metadata -->

    <meta
      name="twitter:card"
      content="summary"
      data-sz-seo="true"
    />

    <meta
      name="twitter:title"
      content="ScholarZone – Verified Scholarship Directory"
      data-sz-seo="true"
    />

    <meta
      name="twitter:description"
      content="Search verified scholarships by country, degree, funding type and deadline. Every listing has been checked against the awarding body's own official page."
      data-sz-seo="true"
    />

    <!-- Structured data -->

    <script type="application/ld+json" data-sz-seo="true">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ScholarZone",
        "url": "https://schollarzone.netlify.app/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://schollarzone.netlify.app/scholarships?search={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

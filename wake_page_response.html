<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waking up your container...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        .moon-icon {
            font-size: 44px;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .status {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
            min-height: 24px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info {
            font-size: 14px;
            color: #888;
            margin-top: 20px;
            line-height: 1.6;
        }

        .error {
            color: #e53e3e;
            font-weight: 500;
        }

        .success {
            color: #38a169;
            font-weight: 500;
        }

        .subdomain {
            font-family: 'Courier New', monospace;
            background: #f7fafc;
            padding: 8px 12px;
            border-radius: 6px;
            display: inline-block;
            margin: 10px 0;
            color: #667eea;
            font-weight: 600;
            max-width: 100%;
            overflow-wrap: anywhere;
        }

        .retry-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .retry-btn:hover {
            background: #5568d3;
        }

        .brand-logo {
            height: 48px;
            margin-bottom: 24px;
            display: none;
        }

        .cta {
            display: none;
            margin-top: 26px;
            padding: 18px;
            background: #f5f3ff;
            border: 1px solid #ddd6fe;
            border-radius: 12px;
            text-align: center;
        }
        .cta-eyebrow {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .03em;
            text-transform: uppercase;
            color: #6d28d9;
            margin-bottom: 6px;
        }
        .cta-title { font-size: 16px; color: #1f2937; margin-bottom: 4px; }
        .cta-sub { font-size: 13px; color: #6b7280; margin-bottom: 14px; }
        .cta-primary {
            display: block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 12px 18px;
            border-radius: 9px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 6px 18px rgba(118, 75, 162, .35);
        }
        .cta-primary:hover { opacity: .93; }
        .cta-secondary {
            display: inline-block;
            margin-top: 10px;
            color: #4f46e5;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }
        .cta-secondary:hover { text-decoration: underline; }

        /* Mobile: keep the card readable and every control comfortably tappable */
        @media (max-width: 480px) {
            body { padding: 14px; }
            .container { padding: 34px 20px; border-radius: 16px; width: 100%; }
            .brand-logo { height: 40px; margin-bottom: 18px; }
            .moon-icon { font-size: 40px; margin-bottom: 14px; }
            h1 { font-size: 22px; margin-bottom: 12px; }
            .status { font-size: 15px; margin-bottom: 24px; }
            .subdomain { font-size: 13px; }
            .spinner { width: 44px; height: 44px; margin-bottom: 24px; }
            .info { font-size: 13px; }
            .retry-btn { width: 100%; padding: 14px 20px; }
            .cta { padding: 16px; margin-top: 22px; }
            .cta-title { font-size: 15px; }
            .cta-primary { padding: 14px 18px; }
            .cta-secondary { display: block; margin-top: 12px; padding: 6px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="brand-logo" id="brand-logo" alt="SnapDeploy" />
        <div class="moon-icon">🌙</div>
        <h1>Container is Sleeping</h1>
        <div class="subdomain" id="subdomain"></div>
        <div class="spinner"></div>
        <div class="status" id="status">Waking up your container...</div>
        <div class="info" id="info">
            Your container was automatically put to sleep due to inactivity.<br>
            It will be ready in 60-90 seconds.
        </div>
        <div class="cta" id="always-on-cta"></div>
    </div>

    <script>
        const POLLING_INTERVAL = 3000; // 3 seconds
        const MAX_ATTEMPTS = 60; // 3 minutes total
        // GPU-only poll budget: a Dedicated GPU wake provisions a dedicated instance
        // (~5-8 min), so the 3-minute CPU budget would declare failure mid-provisioning.
        // Used ONLY when the wake API reports computeType === 'GPU'; CPU keeps MAX_ATTEMPTS.
        const GPU_MAX_ATTEMPTS = 200; // 10 minutes total
        // Dev containers live on .containers.somdip.dev OR the isolated
        // .containers-dev.snapdeploy.app domain — both talk to the DEV platform.
        // Everything else (prod: .containers.snapdeploy.dev / .containers.snapdeploy.app)
        // talks to the PROD platform. The platform hosts stay on .dev.
        const _isDevHost = window.location.hostname.includes('containers.somdip.dev')
                        || window.location.hostname.includes('containers-dev.snapdeploy.app');
        const API_BASE = window.location.protocol + '//' +
                        (_isDevHost ? 'containers.somdip.dev' : 'snapdeploy.dev');

        let attempts = 0;
        let wakeInitiated = false;
        let isGpuWake = false; // set from the wake API response — gates the GPU-only branches below

        // Refresh-proof elapsed timer (display-only, shared by CPU and GPU): persist the
        // true wake-start moment in localStorage keyed by the container host, so a page
        // refresh resumes the real elapsed time instead of restarting at 0. Polling
        // cadence, attempt limits and all status/info copy are unchanged — only the
        // number rendered in "Starting up... (Ns)" reads from this clock.
        const WAKE_START_KEY = 'snapdeploy-wake-' + window.location.hostname;
        const WAKE_START_STALE_MS = 30 * 60 * 1000; // ignore leftovers from an abandoned wake
        let wakeStartMs = Date.now();
        function initWakeTimer() {
            try {
                const stored = parseInt(localStorage.getItem(WAKE_START_KEY), 10);
                const age = Date.now() - stored;
                if (stored > 0 && age >= 0 && age < WAKE_START_STALE_MS) {
                    wakeStartMs = stored; // refresh mid-wake: resume the true elapsed time
                } else {
                    localStorage.setItem(WAKE_START_KEY, String(wakeStartMs));
                }
            } catch (e) { /* storage unavailable — fall back to a per-load timer */ }
        }
        function clearWakeTimer() {
            try { localStorage.removeItem(WAKE_START_KEY); } catch (e) { /* best-effort */ }
        }

        // Extract subdomain from current URL
        function getSubdomain() {
            const hostname = window.location.hostname;
            const parts = hostname.split('.');
            if (parts.length >= 3) {
                return parts[0]; // e.g., "hr-demo" from "hr-demo.containers.somdip.dev"
            }
            return null;
        }

        // Update status message
        function updateStatus(message, type = 'normal') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = 'status ' + type;
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c =>
                ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        // Size-aware Always-On upsell. Price buckets mirror the app's getAlwaysOnPrice
        // (<=512MB Small $12 + $1 Sprint Pack, <=2048MB Medium $25, else Large $45).
        // Suppressed if the container is already Always-On or size is unknown.
        function renderUpsell(data) {
            if (!data || data.alwaysOn || !data.memory || !data.containerId) return;
            // GPU containers: their own tier-priced Dedicated GPU CTA — the
            // size-based Small/Medium/Large pricing below is CPU-only and would show a
            // nonsense "$45/mo Large" for a T4's 8 GB. CPU rendering below is unchanged.
            if (data.computeType === 'GPU') {
                const gpuName = escapeHtml(data.containerName || getSubdomain() || 'this container');
                const gpuTier = escapeHtml(data.gpuTier || 'T4');
                // Tier map (A10G launch): price + checkout param per GPU tier; unknown/legacy
                // tiers fall back to the T4 entry tier. Add future tiers here.
                const GPU_TIER_CTA = {
                    'T4':   { price: '$499/mo', checkout: 'gpu-t4' },
                    'A10G': { price: '$999/mo', checkout: 'gpu-a10g' }
                };
                const gpuCta = GPU_TIER_CTA[gpuTier] || GPU_TIER_CTA['T4'];
                const gpuHtml =
                    '<p class="cta-eyebrow">⚡ Never wait for a cold start again</p>' +
                    '<p class="cta-title">Keep <strong>' + gpuName + '</strong> always on</p>' +
                    '<p class="cta-sub">Dedicated GPU (NVIDIA ' + gpuTier + ') · your own GPU · runs 24/7</p>' +
                    '<a class="cta-primary" href="' + API_BASE + '/billing?checkout=' + gpuCta.checkout + '">Get Dedicated GPU — ' + gpuCta.price + '</a>';
                const gpuEl = document.getElementById('always-on-cta');
                gpuEl.innerHTML = gpuHtml;
                gpuEl.style.display = 'block';
                return;
            }
            const mem = parseInt(data.memory) || 512;
            const price = mem <= 512 ? 12 : (mem <= 2048 ? 25 : 45);
            const sizeLabel = mem <= 512 ? 'Small' : (mem <= 2048 ? 'Medium' : 'Large');
            const sprintEligible = mem <= 512;
            const name = escapeHtml(data.containerName || getSubdomain() || 'this container');
            const cid = encodeURIComponent(data.containerId);

            let html =
                '<p class="cta-eyebrow">⚡ Never wait for a cold start again</p>' +
                '<p class="cta-title">Keep <strong>' + name + '</strong> always on</p>' +
                '<p class="cta-sub">' + sizeLabel + ' container · runs 24/7 · instant every visit</p>' +
                '<a class="cta-primary" href="' + API_BASE + '/containers?alwaysOn=' + cid +
                    '&aoMem=' + mem +
                    '&aoName=' + encodeURIComponent(data.containerName || getSubdomain() || '') +
                    '">Go Always-On — $' + price + '/mo</a>';
            if (sprintEligible) {
                // /containers* is a claimed Universal Link / App Link path (unlike
                // /billing), so on a phone with the app installed this opens the app
                // straight into Sprint Pack checkout; the web containers page
                // redirects it to /sprint-pack for browsers.
                html += '<a class="cta-secondary" href="' + API_BASE + '/containers?sprint=' + cid +
                        '&spName=' + encodeURIComponent(data.containerName || getSubdomain() || '') +
                        '">or skip the wait right now — $1 Sprint Pack (24h always-on)</a>';
            }
            const el = document.getElementById('always-on-cta');
            el.innerHTML = html;
            el.style.display = 'block';
        }

        // Call wake API
        async function wakeContainer(subdomain) {
            try {
                updateStatus('Sending wake signal...');
                const response = await fetch(`${API_BASE}/api/public/wake/${subdomain}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    // GPU-only honest timing: a Dedicated GPU wake provisions a dedicated
                    // instance from zero, so the CPU "60-90 seconds" copy would be a lie
                    // here. CPU containers never enter this branch — their copy is untouched.
                    if (data && data.computeType === 'GPU') {
                        isGpuWake = true;
                        document.getElementById('info').textContent =
                            'Dedicated GPU containers take about 5–8 minutes to wake — a dedicated instance is being provisioned for you.';
                    }
                    updateStatus('Container is starting up...');
                    renderUpsell(data);
                    return true;
                } else if (response.status === 429) {
                    updateStatus('Too many requests. Please wait a moment.', 'error');
                    return false;
                } else if (response.status === 402) {
                    // Parse the detailed error response. Use API_BASE (env-aware) — NOT a
                    // hardcoded prod host — so a dev container's CTA stays on the dev platform
                    // and the ?ao_tier= checkout param is preserved end-to-end.
                    let errorMessage = 'Container cannot be started. Usage limit reached.';
                    let actionUrl = API_BASE + '/billing';
                    let actionText = 'Upgrade Plan';

                    try {
                        const errorData = await response.json();
                        if (errorData.message) errorMessage = errorData.message;
                        if (errorData.actionUrl) actionUrl = API_BASE + errorData.actionUrl;
                        if (errorData.actionText) actionText = errorData.actionText;
                    } catch (e) {
                        // Use defaults if JSON parsing fails
                    }

                    updateStatus(errorMessage, 'error');
                    document.querySelector('.spinner').style.display = 'none';
                    document.querySelector('.moon-icon').textContent = '⚠️';
                    document.getElementById('info').innerHTML =
                        `<a href="${actionUrl}" class="retry-btn" style="text-decoration: none; display: inline-block;">${actionText}</a>`;
                    return false;
                } else {
                    const error = await response.text();
                    updateStatus('Failed to wake container: ' + error, 'error');
                    return false;
                }
            } catch (error) {
                console.error('Wake error:', error);
                updateStatus('Network error. Retrying...', 'error');
                return false;
            }
        }

        // Check if container is healthy
        async function checkContainerHealth(subdomain) {
            try {
                // Try to fetch the original URL
                const response = await fetch(window.location.href, {
                    method: 'HEAD',
                    cache: 'no-cache'
                });

                // If we get anything other than 503, the container is responding
                if (response.status !== 503) {
                    return true;
                }
                return false;
            } catch (error) {
                // Network errors might mean container is still starting
                return false;
            }
        }

        // Poll container status
        async function pollContainerStatus(subdomain) {
            attempts++;

            if (attempts > (isGpuWake ? GPU_MAX_ATTEMPTS : MAX_ATTEMPTS)) {
                updateStatus('Container is taking longer than expected to start.', 'error');
                document.querySelector('.spinner').style.display = 'none';
                document.getElementById('info').innerHTML =
                    'Please try refreshing the page or check the dashboard.<br>' +
                    `<button class="retry-btn" onclick="location.reload()">Retry</button>`;
                return;
            }

            const isHealthy = await checkContainerHealth(subdomain);

            if (isHealthy) {
                clearWakeTimer(); // app is up — the next sleep/wake cycle starts a fresh clock
                updateStatus('Container is ready! Redirecting...', 'success');
                document.querySelector('.moon-icon').textContent = '✅';
                document.querySelector('.spinner').style.display = 'none';
                setTimeout(() => {
                    window.location.href = window.location.href;
                }, 3000);
            } else {
                // Elapsed reads from the persisted wake-start clock (refresh-proof),
                // not the per-load attempt counter. Display-only.
                const elapsed = Math.max(0, Math.floor((Date.now() - wakeStartMs) / 1000));
                updateStatus(`Starting up... (${elapsed}s)`);
                setTimeout(() => pollContainerStatus(subdomain), POLLING_INTERVAL);
            }
        }

        // Main execution
        async function init() {
            // Logo is served by the platform host (API_BASE), not the container host.
            const logo = document.getElementById('brand-logo');
            logo.onload = () => { logo.style.display = 'inline-block'; };
            logo.src = API_BASE + '/images/snapdeploy-logo.png';

            const subdomain = getSubdomain();

            if (!subdomain) {
                updateStatus('Invalid container URL', 'error');
                document.querySelector('.spinner').style.display = 'none';
                return;
            }

            document.getElementById('subdomain').textContent = subdomain;

            initWakeTimer(); // resume (or start) the refresh-proof elapsed clock

            // Initiate wake
            const wakeSuccess = await wakeContainer(subdomain);

            if (!wakeSuccess) {
                // If wake failed due to rate limiting or other errors, still try polling
                // in case container is already waking up
                if (document.querySelector('.status').classList.contains('error')) {
                    // Critical error, don't continue polling
                    document.querySelector('.spinner').style.display = 'none';
                    return;
                }
            }

            // Start polling
            setTimeout(() => pollContainerStatus(subdomain), POLLING_INTERVAL);
        }

        // Start when page loads
        window.addEventListener('load', init);
    </script>

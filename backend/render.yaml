# ScholarZone Backend - Deployment Configuration
#
# This file configures deployment to Render.com with:
# - Web Service: FastAPI application (Docker)
#
# PostgreSQL is provided by Neon (free tier, no credit card).
# Scheduled verification is provided by GitHub Actions (free).
#
# SCHEDULE: Every 12 hours via GitHub Actions cron (7 */12 * * *)
# This means verification runs at 00:07 and 12:07 UTC daily.
#
# To deploy:
# 1. Push code to GitHub
# 2. Connect repository to Render
# 3. Render will auto-detect render.yaml and create the web service
# 4. Set SCHOLARZONE_DATABASE_URL to your Neon connection string in Render dashboard

services:
  - type: web
    name: scholarzone-api
    runtime: docker
    plan: starter
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SCHOLARZONE_ENVIRONMENT
        value: production
      - key: SCHOLARZONE_DATABASE_URL
        sync: false
      - key: SCHOLARZONE_ALLOWED_ORIGINS
        sync: false
      - key: SCHOLARZONE_VERIFICATION_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATION_EMAIL
        sync: false

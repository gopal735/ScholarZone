[pytest]
# Collection is scoped to `tests/` deliberately.
#
# `backend/` also contains fifteen `*test*.py` files that are ad-hoc developer
# scripts, not pytest modules: none of them defines a single `test_` function.
# pytest collected them anyway because of the filename, and ran their
# module-level code on import - `cache_bust_test.py` issues an HTTP GET to the
# deployed production API at import time. Scoping collection keeps the suite
# hermetic: no test run reaches the network, and no file outside `tests/` is
# executed as a side effect of asking for the tests.
testpaths = tests

# Fail on anything that would otherwise be a silent skip, so a green run means
# every test in the suite actually ran.
addopts = -ra --strict-markers

filterwarnings =
    ignore::DeprecationWarning:starlette.*

      - generic [ref=f3e314]:
        - complementary [ref=f3e315]:
          - text: Scholarship Program
          - heading "DOST-SEI-USask Graduate Scholarship Program" [level=2] [ref=f3e316]
        - generic [ref=f3e317]:
          - article [ref=f3e318]:
            - heading "Program Overview" [level=3] [ref=f3e319]
            - paragraph [ref=f3e320]: The program aims to promote long-term collaboration and exchange in graduate education between the DOST-SEI and the University of Saskatchewan (USask) in Saskatoon, Canada in the priority S&T fields to create mechanisms for doctoral students from the Philippines to study and conduct their research at USask with support provided jointly by both institutions.
          - article [ref=f3e321]:
            - heading "Priority Fields of Study" [level=3] [ref=f3e322]
            - list [ref=f3e323]:
              - listitem [ref=f3e324]: Animal and Poultry Science
              - listitem [ref=f3e325]: Biochemistry, Microbiology and Immunology
              - listitem [ref=f3e326]: Chemistry
              - listitem [ref=f3e327]: Environmental and Sustainability
              - listitem [ref=f3e328]: Health Sciences
              - listitem [ref=f3e329]: Physics and Engineering Physics
              - listitem [ref=f3e330]: Soil Science
              - listitem [ref=f3e331]: Vaccinology and Immunotherapeutics
              - listitem [ref=f3e332]: Veterinary Biomedical Sciences
              - listitem [ref=f3e333]: Veterinary Microbiology
              - listitem [ref=f3e334]: Veterinary Pathology
          - article [ref=f3e335]:
            - heading "Criteria of Eligibility" [level=3] [ref=f3e336]
            - paragraph [ref=f3e337]: The scholarship is open to qualified Filipino citizens who are in their first five years of their research career and meet the eligibility requirements.
            - paragraph [ref=f3e338]: "An applicant must:"
            - list [ref=f3e339]:
              - listitem [ref=f3e340]: ✓ be a Filipino citizen;
              - listitem [ref=f3e341]: ✓ not be more than 50 years old at the time of application;
              - listitem [ref=f3e342]: ✓ be a permanent/regular employee in any private/goverment institution/office in the Philippines;
              - listitem [ref=f3e343]: ✓ be endorsed by the Head of the Sending Institution/Office;
              - listitem [ref=f3e344]: ✓ pass the admission requirements for graduate studies in a foreign university with good track record;
              - listitem [ref=f3e345]: ✓ pass the interview and other screening procedures;
              - listitem [ref=f3e346]: ✓ have a research interest aligned with the areas/programs identified under the DOST’s Harmonized National Research and Development Agenda (HNRDA); and
              - listitem [ref=f3e347]: ✓ have a viable re-entry plan.
          - article [ref=f3e348]:
            - heading "Other Conditions" [level=3] [ref=f3e349]
            - list [ref=f3e350]:
              - listitem [ref=f3e351]: The qualified applicant will pursue MS or PhD Program on a full-time basis for a maximum period of 24 or 36 months, respectively.
              - listitem [ref=f3e352]: No lateral entrant shall be considered.
              - listitem [ref=f3e353]: The scholar must not avail or enjoy any other scholarships.
              - listitem [ref=f3e354]: The scholar must make a full-time commitment to the scholarship and not engage in any form of employment during the scholarship period.
          - article [ref=f3e355]:
            - heading "Documentary Requirements" [level=3] [ref=f3e356]
            - list [ref=f3e357]:
              - listitem [ref=f3e358]: ✓ Application Form
              - listitem [ref=f3e359]: ✓ Birth Certificate
              - listitem [ref=f3e360]: ✓ Certified True Copy of Official Transcript of Records
              - listitem [ref=f3e361]: ✓ Endorsement from two former professors in college for MS applicants or two professors from the MS program for PhD applicants
              - listitem [ref=f3e362]: ✓ Recommendation from Head of the Sending Institution or Office
              - listitem [ref=f3e363]: ✓ Permission to take a leave of absence while on scholarship
              - listitem [ref=f3e364]: ✓ Medical Certificate as to health status and fitness to study from a licensed physician with PRC license number indicated
              - listitem [ref=f3e365]: ✓ Valid NBI Clearance
              - listitem [ref=f3e366]: ✓ Letter of Admission to the foreign university
              - listitem [ref=f3e367]: ✓ Program of Study
              - listitem [ref=f3e368]: ✓ Budgetary Requirements with supporting documents for bases of rates used
              - listitem [ref=f3e369]: ✓ Re-entry Plan, narrative
            - paragraph [ref=f3e370]: The downloadable form and list of other documentary requirements are available at the official DOST-SEI website.
            - paragraph [ref=f3e371]: Interested applicants may submit an advance copy of their application at fgs@sei.dost.gov.ph.
            - paragraph [ref=f3e372]: Original documents must be submitted to DOST-SEI at the Science Heritage Building, DOST Compound, Bicutan, Taguig City.
          - article [ref=f3e373]:
            - heading "Selection Procedures" [level=3] [ref=f3e374]
            - paragraph [ref=f3e375]: "An applicant goes through the following selection procedure:"
            - list [ref=f3e376]:
              - listitem [ref=f3e377]:
                - strong [ref=f3e378]: First Level Screening
                - generic [ref=f3e379]: Documentary evaluation of application form and other requirements.
              - listitem [ref=f3e380]:
                - strong [ref=f3e381]: Second Level Screening
                - generic [ref=f3e382]: Evaluation of research topic and re-entry plan by the concerned DOST Council.
              - listitem [ref=f3e383]:
                - strong [ref=f3e384]: Third Level Screening
                - generic [ref=f3e385]: Interview by a panel to be created by the SEI Director.
          - article [ref=f3e386]:
            - heading "Important Dates" [level=3] [ref=f3e387]

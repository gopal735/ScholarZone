            - paragraph [ref=f3e414]: The France Excellence - DOST Scholarship Program is the successor of the PhilFrance-DOST Fellowship Program which aims to provide exceptional Filipino students the opportunity to obtain higher education in France every year. It is a comprehensive scholarship crafted for future leaders and key players in the Philippines’ growing research and development sector.

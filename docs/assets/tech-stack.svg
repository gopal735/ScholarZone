<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="ScholarZone technology stack grouped into frontend, backend, and infrastructure">
<defs>
<linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1f3a"/><stop offset="1" stop-color="#0a1628"/></linearGradient>
<linearGradient id="tcard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12264a"/><stop offset="1" stop-color="#0d1c36"/></linearGradient>
<filter id="tsh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/></filter>
</defs>
<rect width="960" height="320" fill="url(#tbg)"/>
<text x="480" y="34" text-anchor="middle" fill="#e8cf9a" font-family="Georgia, serif" font-size="16" font-weight="bold">Technology Stack</text>

<g filter="url(#tsh)"><rect x="40" y="58" width="270" height="232" rx="10" fill="url(#tcard)" stroke="#61dafb" stroke-width="1.5"/><text x="175" y="84" text-anchor="middle" fill="#61dafb" font-family="Georgia, serif" font-size="14" font-weight="bold">FRONTEND</text><line x1="58" y1="98" x2="292" y2="98" stroke="#61dafb" stroke-width="1"/><text x="175" y="124" text-anchor="middle" fill="#e8cf9a" font-family="Georgia, serif" font-size="14" font-weight="bold">React 19.2.8</text><text x="175" y="148" text-anchor="middle" fill="#9fb3d1" font-family="system-ui, sans-serif" font-size="11">react-router-dom 7.18.2</text><text x="175" y="170" text-anchor="middle" fill="#9fb3d1" font-family="system-ui, sans-serif" font-size="11">Vite 8.2.0</text><text x="175" y="192" text-anchor="middle" fill="#9fb3d1" font-family="system-ui, sans-serif" font-size="11">motion 13.1.1</text><text x="175" y="214" text-anchor="middle" fill="#9fb3d1" font-family="system-ui, sans-serif" font-size="11">ESLint 10.8.0</text><text x="175" y="248" text-anchor="middle" fill="#5b7396" font-family="system-ui, sans-serif" font-size="10">static build to GitHub Pages</text></g>

<g filter="url(#tsh)"><rect x="345" y="58" width="270" height="232" rx="10" fill="url(#tcard)" stroke="#5fa8ff" stroke-width="1.5"/><text x="480" y="84" text-anchor="middle" fill="#5fa8ff" font-family="Georgia, serif" font-size="14" font-weight="bold">BACKEND</text><line x1="363" y1="98" x2="597" y2="98" stroke="#5fa8ff" stroke-width="1"/><text x="480" y="124" text-anchor="middle" fill="#e8cf9a" font-family="Georgia, serif" font-size="14" font-weight="bold">Python 3.11</text><text x="480" y="148" text-anchor="middle" fill="#9fb3d1" font-family="system-ui, sans-serif" font-size="11">FastAPI 0.141.1 / Uvicorn</text><text x="480" y="170" text-anchor="middle" fill="#9fb3d1" font-family="system-ui, sans-serif" font-size="11">SQLAlchemy 2.0 / psycopg v3</text><text x="480" y="192" text-anchor="middle" fill="#9fb3d1" font-family="system-ui, sans-serif" font-size="11">Pydantic 2.13.4</text><text x="480" y="214" text-anchor="middle" fill="#9fb3d1" font-family="system-ui, sans-serif" font-size="11">HTTPX, BeautifulSoup4, Pillow</text><text x="480" y="236" text-anchor="middle" fill="#9fb3d1" font-family="system-ui, sans-serif" font-size="11">pytest, Resend</text><text x="480" y="266" text-anchor="middle" fill="#5b7396" font-family="system-ui, sans-serif" font-size="10">containerised on SnapDeploy</text></g>

<g filter="url(#tsh)"><rect x="650" y="58" width="270" height="232" rx="10" fill="url(#tcard)" stroke="#4ade80" stroke-width="1.5"/><text x="785" y="84" text-anchor="middle" fill="#4ade80" font-family="Georgia, serif" font-size="14" font-weight="bold">INFRASTRUCTURE</text><line x1="668" y1="98" x2="902" y2="98" stroke="#4ade80" stroke-width="1"/><text x="785" y="124" text-anchor="middle" fill="#e8cf9a" font-family="Georgia, serif" font-size="14" font-weight="bold">PostgreSQL on Neon</text><text x="785" y="148" text-anchor="middle" fill="#9fb3d1" font-family="system-ui, sans-serif" font-size="11">13 SQLAlchemy models</text><text x="785" y="170" text-anchor="middle" fill="#9fb3d1" font-family="system-ui, sans-serif" font-size="11">GitHub Actions (CI/CD)</text><text x="785" y="192" text-anchor="middle" fill="#9fb3d1" font-family="system-ui, sans-serif" font-size="11">Docker (python:3.11-slim)</text><text x="785" y="214" text-anchor="middle" fill="#9fb3d1" font-family="system-ui, sans-serif" font-size="11">59 test files, 2302 tests</text><text x="785" y="266" text-anchor="middle" fill="#5b7396" font-family="system-ui, sans-serif" font-size="10">verification cron every 12 hours</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="ScholarZone verification and discovery pipeline">
<defs>
<linearGradient id="vbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1f3a"/><stop offset="1" stop-color="#0a1628"/></linearGradient>
<linearGradient id="vcard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12264a"/><stop offset="1" stop-color="#0d1c36"/></linearGradient>
<filter id="vsh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/></filter>
<marker id="va" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c9a96a"/></marker>
</defs>
<rect width="960" height="470" fill="url(#vbg)"/>
<text x="480" y="28" text-anchor="middle" fill="#e8cf9a" font-family="Georgia, serif" font-size="16" font-weight="bold">Verification and Discovery Pipeline</text>
<text x="480" y="50" text-anchor="middle" fill="#9fb3d1" font-family="system-ui, sans-serif" font-size="11">Field-level checks against official sources, every 12 hours</text>

<g filter="url(#vsh)"><rect x="40" y="70" width="170" height="64" rx="9" fill="url(#vcard)" stroke="#c9a96a" stroke-width="1.5"/><text x="125" y="97" text-anchor="middle" fill="#e8cf9a" font-family="Georgia, serif" font-size="13" font-weight="bold">OFFICIAL SOURCE</text><text x="125" y="117" text-anchor="middle" fill="#9fb3d1" font-family="system-ui, sans-serif" font-size="10">Ministry / Embassy</text></g>
<g filter="url(#vsh)"><rect x="265" y="70" width="170" height="64" rx="9" fill="url(#vcard)" stroke="#c9a96a" stroke-width="1.5"/><text x="350" y="97" text-anchor="middle" fill="#e8cf9a" font-family="Georgia, serif" font-size="13" font-weight="bold">FETCH + EXTRACT</text><text x="350" y="117" text-anchor="middle" fill="#9fb3d1" font-family="system-ui, sans-serif" font-size="10">HTTPX / BeautifulSoup</text></g>
<g filter="url(#vsh)"><rect x="490" y="70" width="170" height="64" rx="9" fill="url(#vcard)" stroke="#c9a96a" stroke-width="1.5"/><text x="575" y="97" text-anchor="middle" fill="#e8cf9a" font-family="Georgia, serif" font-size="13" font-weight="bold">VALIDATE</text><text x="575" y="117" text-anchor="middle" fill="#9fb3d1" font-family="system-ui, sans-serif" font-size="10">Pydantic schemas</text></g>
<g filter="url(#vsh)"><rect x="715" y="70" width="205" height="64" rx="9" fill="url(#vcard)" stroke="#c9a96a" stroke-width="1.5"/><text x="817" y="97" text-anchor="middle" fill="#e8cf9a" font-family="Georgia, serif" font-size="13" font-weight="bold">CONFIDENCE GATE</text><text x="817" y="117" text-anchor="middle" fill="#9fb3d1" font-family="system-ui, sans-serif" font-size="10">HIGH / MEDIUM / LOW</text></g>

<line x1="210" y1="102" x2="258" y2="102" stroke="#c9a96a" stroke-width="2" marker-end="url(#va)"/>
<line x1="435" y1="102" x2="483" y2="102" stroke="#c9a96a" stroke-width="2" marker-end="url(#va)"/>
<line x1="660" y1="102" x2="708" y2="102" stroke="#c9a96a" stroke-width="2" marker-end="url(#va)"/>

<line x1="817" y1="134" x2="817" y2="190" stroke="#c9a96a" stroke-width="2"/>
<line x1="125" y1="190" x2="817" y2="190" stroke="#c9a96a" stroke-width="2"/>
<line x1="125" y1="190" x2="125" y2="234" stroke="#c9a96a" stroke-width="2" marker-end="url(#va)"/>
<line x1="575" y1="190" x2="575" y2="234" stroke="#c9a96a" stroke-width="2" marker-end="url(#va)"/>

<g filter="url(#vsh)"><rect x="40" y="240" width="170" height="64" rx="9" fill="url(#vcard)" stroke="#4ade80" stroke-width="1.5"/><text x="125" y="267" text-anchor="middle" fill="#86efac" font-family="Georgia, serif" font-size="13" font-weight="bold">AUTO-APPLY</text><text x="125" y="287" text-anchor="middle" fill="#9fb3d1" font-family="system-ui, sans-serif" font-size="10">HIGH confidence only</text></g>
<g filter="url(#vsh)"><rect x="490" y="240" width="170" height="64" rx="9" fill="url(#vcard)" stroke="#fbbf24" stroke-width="1.5"/><text x="575" y="267" text-anchor="middle" fill="#fcd34d" font-family="Georgia, serif" font-size="13" font-weight="bold">HUMAN REVIEW</text><text x="575" y="287" text-anchor="middle" fill="#9fb3d1" font-family="system-ui, sans-serif" font-size="10">MEDIUM / LOW</text></g>

<line x1="125" y1="304" x2="125" y2="374" stroke="#4ade80" stroke-width="2" marker-end="url(#va)"/>
<line x1="575" y1="304" x2="575" y2="374" stroke="#fbbf24" stroke-width="2" marker-end="url(#va)"/>
<line x1="817" y1="190" x2="817" y2="374" stroke="#5fa8ff" stroke-width="1.5" stroke-dasharray="6,5" marker-end="url(#va)"/>

<g filter="url(#vsh)"><rect x="40" y="380" width="170" height="64" rx="9" fill="url(#vcard)" stroke="#c9a96a" stroke-width="1.5"/><text x="125" y="407" text-anchor="middle" fill="#e8cf9a" font-family="Georgia, serif" font-size="13" font-weight="bold">AUDIT TRAIL</text><text x="125" y="427" text-anchor="middle" fill="#9fb3d1" font-family="system-ui, sans-serif" font-size="10">old / new + source URL</text></g>
<g filter="url(#vsh)"><rect x="490" y="380" width="170" height="64" rx="9" fill="url(#vcard)" stroke="#c9a96a" stroke-width="1.5"/><text x="575" y="407" text-anchor="middle" fill="#e8cf9a" font-family="Georgia, serif" font-size="13" font-weight="bold">APPROVE / REJECT</text><text x="575" y="427" text-anchor="middle" fill="#9fb3d1" font-family="system-ui, sans-serif" font-size="10">append-only record</text></g>
<g filter="url(#vsh)"><rect x="715" y="380" width="205" height="64" rx="9" fill="url(#vcard)" stroke="#5fa8ff" stroke-width="1.5"/><text x="817" y="407" text-anchor="middle" fill="#8ab4ff" font-family="Georgia, serif" font-size="13" font-weight="bold">SOURCE HEALTH</text><text x="817" y="427" text-anchor="middle" fill="#9fb3d1" font-family="system-ui, sans-serif" font-size="10">track + deprioritise</text></g>
</svg>
